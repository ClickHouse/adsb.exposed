<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" href="favicon.png">
    <title>ADS-B Massive Visualizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        :root {
            --progress: 0%;
            --progress-background-color1: #320;
            --progress-foreground-color1: #840;

            --progress-background-color2: #330;
            --progress-foreground-color2: #880;

            --progress-background-color3: #033;
            --progress-foreground-color3: #088;

            --progress-background-color-last: #333;
            --progress-foreground-color-last: #666;

            --progress-background-color: var(--progress-background-color4);
            --progress-foreground-color: var(--progress-foreground-color4);

            /* Width of the report panel's draggable left border. Read from JavaScript to
               decide whether a pointer press landed on the grip. */
            --report-grip-width: 8px;
        }
        * {
            box-sizing: border-box;
        }

        html, body {
            background: #101213;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            scrollbar-color: #333 black;
        }

        body {
            display: grid;
            grid-template-columns: auto 0%;
            grid-template-rows: fit-content(2em) fit-content(2em) fit-content(10%) fit-content(2em) fit-content(2.6em) 1em auto;
            grid-gap: 0;
        }

        /* The report panel lives in the second grid column, which stays collapsed to zero
           width while there is no report. The two states are switched with a class rather
           than by rewriting a `--report-width` variable interpolated into
           `grid-template-columns`, because in Firefox the column sometimes kept its old
           width and the panel would not go away (issue #3). A plain class toggle changes
           the declared value of the property itself, which does not depend on Firefox
           invalidating the grid layout when only a custom property changes. */
        body.report-open {
            grid-template-columns: auto fit-content(20%);
        }

        #proud {
            grid-column: span 2;
            font-family: sans-serif;
            font-size: 14pt;
            background: linear-gradient(
                90deg,
                white 0%,
                white 15%,
                yellow 50%,
                white 85%,
                white 100%
            );
            color: black;
            text-align: center;
            padding: 0.125em;
            text-decoration: none;
        }

        #proud:hover {
            background: linear-gradient(
                90deg,
                yellow 0%,
                yellow 15%,
                white 50%,
                yellow 85%,
                yellow 100%
            );
        }

        #query {
            grid-column: span 2;
            width: 100%;
            min-width: 100%;
            max-width: 100vw;
            height: 4.5em;
            max-height: 50vh;
            margin: 0;
            padding: .5em;
            outline: none;
            border: none;
            background: #101213;
            color: lightgray;
            font-size: 14pt;
            border-bottom: 1px #333 solid;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #111;
            image-rendering: pixelated;
            position: relative;
        }

        /* The 3D globe overlays the Leaflet map, taking over its (grid-sized) area. */
        #cesium {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 1000;
            image-rendering: auto;
        }

        .leaflet-fade-anim .leaflet-popup {
            transition: none;
            font-family: monospace;
        }

        .leaflet-control-attribution {
            font-size: 12pt;
        }

        #error {
            display: none;
            position: absolute;
            z-index: 1001;
            bottom: max(5%, 1em);
            left: 50%;
            transform: translate(-50%, 0);
            background: #300;
            color: white;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 16pt;
            padding: 1em;
            padding-right: 2em;
            min-width: 50%;
            max-width: 80%;
        }

        #error-close {
            position: absolute;
            top: 0;
            right: 0;
            padding: 0 .4em;
            font-size: 20pt;
            line-height: 1.2em;
            cursor: pointer;
            user-select: none;
            color: #f99;
        }

        #error-close:hover {
            color: white;
        }

        #selection {
            display: none;
            position: absolute;
            z-index: 1001;
            border: 1px dashed white;
            backdrop-filter: brightness(150%);
            -webkit-backdrop-filter: brightness(150%); /* Safari */
        }

        #timeslider {
            grid-column: span 2;
            position: relative;
            display: block;
            background: #181a1b;
            height: 2.6em;
            padding: 0;
            overflow: hidden;
            font-family: monospace;
            color: #aaa;
            user-select: none;
        }

        #timeslider-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: ew-resize;
            touch-action: none;
        }

        #timeslider-title {
            position: absolute;
            left: 0.5em;
            top: 0.2em;
            font-size: 10pt;
            color: #bbb;
            pointer-events: none;
            z-index: 2;
            text-shadow: 0 1px 2px #000, 0 0 4px #000, 0 0 4px #000;
        }

        #timeslider-label {
            color: #eee;
            white-space: nowrap;
            text-shadow: 0 1px 2px #000, 0 0 4px #000, 0 0 4px #000;
        }

        #timeslider-hover {
            position: absolute;
            bottom: 0.05em;
            display: none;
            transform: translateX(-50%);
            font-size: 9pt;
            color: #fff;
            background: rgba(16, 18, 19, 0.85);
            padding: 0 0.3em;
            border-radius: 2px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 3;
            text-shadow: 0 0 2px #000;
        }

        #timeslider-reset {
            position: absolute;
            right: 0.4em;
            top: 0.1em;
            z-index: 2;
            display: none;
            background: #444;
            color: white;
            font-size: 10pt;
            padding: 0.1em 0.5em;
            border: solid 0.125em black;
            cursor: pointer;
        }

        #timeslider-reset:hover {
            background: yellow;
            color: black;
        }

        #stats {
            grid-column: span 2;
            background: linear-gradient(to right,
                var(--progress-background-color) 0%,
                var(--progress-foreground-color) var(--progress),
                var(--progress-background-color) var(--progress));
            color: white;
            padding-right: .5em;
            font-family: monospace;
            text-align: right;
        }

        .choices {
            grid-column: span 2;
            background: #202020;
            color: white;
            font-size: 12pt;
            font-family: monospace;
            padding: .125em .5em;
        }

        .choices span {
            display: inline-block;
            padding: .25em .5em;
            background: #444;
            border: solid 0.125em black;
            user-select: none;
        }

        .choices span:hover, .choices span.selected:hover {
            color: black;
            background: yellow;
            cursor: pointer;
        }

        .choices span.selected {
            background: #FFF;
            color: #000;
        }

        /* The right-hand buttons of the datasets row are floated, and come first in the DOM,
           so that the dataset buttons flow around them instead of being pushed below them
           when the row spills onto several lines. The 3D toggle is the leftmost of them, and
           its left margin is what separates the whole group from the dataset buttons; the two
           sit flush against each other, as the dataset buttons do. */
        #toggle-3d {
            float: right;
            margin: 0 0 .25em .5em;
        }

        /* GitHub star counter, floated to the right of the 3D toggle. It is an <a>, and its
           counter a <b>, not spans, so that neither the dataset-selection loops nor the
           `.choices span` box styling of the row treat them as dataset choices. */
        #github-stars {
            float: right;
            margin: 0 0 .25em 0;
            display: inline-block;
            padding: .25em .5em;
            background: #444;
            border: solid 0.125em black;
            color: white;
            text-decoration: none;
            user-select: none;
            white-space: nowrap;
        }

        #github-stars:hover {
            color: black;
            background: yellow;
        }

        #github-stars svg {
            width: 1em;
            height: 1em;
            fill: currentColor;
            vertical-align: -0.125em;
        }

        #github-stars b {
            font-weight: bold;
        }

        /* The active filter: the conditions added to the example's own WHERE clause, either by
           clicking a report item or by hand. It is highlighted in yellow, because it silently
           affects everything on the map, and it is not a span, so that neither the example
           selection loops nor the `.choices span` box styling treat it as an example. */
        #active-filter {
            display: none;
            float: right;
            padding: .25em .5em;
            background: yellow;
            border: solid 0.125em black;
            color: black;
            white-space: nowrap;
            user-select: none;
        }

        #active-filter-text {
            display: inline-block;
            max-width: 30em;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: bottom;
            font-weight: bold;
        }

        #active-filter-clear {
            padding-left: .5em;
            cursor: pointer;
        }

        #active-filter-clear:hover {
            color: #c00;
        }

        #report {
            color: white;
            font-size: 12pt;
            font-family: monospace;
            background: #202020;
            padding: .5em;
            display: none;
            max-height: 100%;
            overflow-y: scroll;
            /* The left border doubles as the grip for resizing the panel. Being a border of
               the panel itself, it stays glued to the panel's edge for free — a separately
               positioned handle would have to be kept aligned as the width changes, and,
               inside this scroll container, would scroll away with the content. */
            border-left: var(--report-grip-width) solid #333;
            /* Vertical panning still scrolls the panel; horizontal drags are ours. */
            touch-action: pan-y;
        }

        #report.grip {
            border-left-color: #666;
            cursor: col-resize;
        }

        /* While dragging, the pointer keeps the resize cursor wherever it travels, and
           text under it must not get selected. */
        body.report-resizing, body.report-resizing #report {
            cursor: col-resize;
            user-select: none;
        }

        #report div {
            margin-bottom: 1em;
            white-space: pre-wrap;
            color: lightgray;
        }

        #report a {
            color: white;
            border-bottom: 1px dashed #888;
            cursor: pointer;
        }

        #report a:hover {
            color: yellow;
            background: black;
            border-bottom: 1px dashed yellow;
            box-shadow: 0px 0px 10px rgba(0,0,0,1);
            font-weight: bold;
        }

        /// A per-report progress bar and stats line, driven by the live progress
        /// packets of the JSONEachRowWithProgress reports. The green fill is drawn
        /// behind the text so the query time stays readable while it advances.
        #report_progress {
            margin-bottom: 1em;
            padding: 1px 4px;
            min-height: 1.3em;
            color: #ddd;
            font-size: 10pt;
            white-space: normal;
            background:
                linear-gradient(to right,
                    rgba(40, 150, 90, 0.6) 0%,
                    rgba(40, 150, 90, 0.6) var(--report-progress, 0%),
                    rgba(255, 255, 255, 0.06) var(--report-progress, 0%));
        }

        #picture {
            position: absolute;
            left: 1em;
            bottom: 4em;
            font-size: 16pt;
            z-index: 1001;
            display: none;
            box-shadow: 2px 2px 10px rgba(0,0,0,1);
            line-height: 0;
            min-width: 500px;
            min-height: 1em;
        }

        #picture-copyright {
            position: absolute;
            left: 0;
            bottom: 0;
            font-family: sans-serif;
            font-size: 12pt;
            line-height: 1;
            background: rgba(255, 255, 255, 0.5);
        }

        #picture-copyright a {
            text-decoration: none;
            color: #088;
        }

        #layers, #provider, #select {
            position: absolute;
            padding: .3em .5em .2em .5em;
            font-family: monospace;
            color: black;
            background: lightgray;
            box-shadow: 2px 2px 10px rgba(0,0,0,1);
            z-index: 1001;
            user-select: none;
        }

        #layers:hover, #provider:hover, #select:hover {
            filter: brightness(125%);
        }

        #layers {
            left: 1em;
            bottom: 1em;
            width: 2em;
            height: 2em;
            padding: .3em .5em .2em .5em;
            font-size: 16pt;
            text-align: center;
            cursor: pointer;
        }

        #select {
            left: 4em;
            bottom: 1em;
            width: 2em;
            height: 2em;
            padding: .3em .5em .2em .5em;
            font-size: 16pt;
            text-align: center;
            cursor: pointer;
        }

        #select img {
            padding-top: 13%;
            width: 120%;
        }

        #provider {
            right: 0.25em;
            bottom: 1.25em;
            height: 3em;
            padding: 0.1em .3em 0.1em 0.3em;
            font-size: 16pt;
        }

        #provider form {
            font-size: 12pt;
            color: #333;
        }

        #provider * {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <a id="proud" href="https://github.com/ClickHouse/ClickHouse">Proudly made with <b>ClickHouse</b> open-source database</a>
    <div id="datasets" class="choices"></div>
    <textarea spellcheck="false" data-gramm="false" id="query"></textarea>
    <div id="examples" class="choices"><div id="active-filter">Filter: <b id="active-filter-text"></b><b id="active-filter-clear" title="Clear the filter">&times;</b></div></div>
    <div id="timeslider">
        <span id="timeslider-title">Time: <span id="timeslider-label"></span></span>
        <span id="timeslider-reset">Reset</span>
        <canvas id="timeslider-canvas"></canvas>
        <span id="timeslider-hover"></span>
    </div>
    <div id="stats"></div>
    <div id="map"><div id="selection"></div><div id="cesium"></div></div>
    <div id="report"></div>
    <div id="picture"><img/><span id="picture-copyright">Picture from Wikipedia, &copy; the details at the corresponding page.</span></div>
    <div id="error"><span id="error-close" title="Close">&times;</span><span id="error-text"></span></div>
    <div id="layers">👁</div>
    <div id="select"><img src="pointer.svg"/></div>

    <div id="provider"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="config.js"></script>
    <script>
        let uuid = crypto.randomUUID();

        let dataset;
        let config;
        let queries;
        let levels;

        /// Experimental 3D globe mode (CesiumJS), hidden behind ?3d=1. See the block
        /// near the end of this script. When active, the density tiles are draped over
        /// a real sphere instead of a flat Mercator plane.
        const is3D = new URLSearchParams(window.location.search).get('3d') == '1';
        let cesiumViewer = null;
        let cesiumDensityLayer = null;
        /// The selection rectangle drawn on the globe (a Cesium.Rectangle, or null for none).
        /// Declared up here, and not down in the Cesium block with the rest of its state,
        /// because showReport()/hideReport() keep it in step with `selected_box` and both can
        /// run while the page is still loading — long before that block is reached.
        let cesiumSelectionRectangle = null;

        /// ClickHouse always renders a density tile as 1024x1024 pixels, and one of those
        /// pixels covers exactly one CSS pixel. On a high-DPI display that means every data
        /// pixel is stretched over devicePixelRatio² device pixels, and with
        /// `image-rendering: pixelated` it becomes a plainly visible square. Giving the tile
        /// a `tile_scale` times smaller footprint and asking for a tile `tile_zoom_shift`
        /// levels deeper instead puts one data pixel on one device pixel.
        ///
        /// Opt-in through ?res=, because the resolution is paid for in full: tile_scale² times
        /// more tiles, queries and bytes, and a whole new set of server-side query cache keys.
        /// ?res=2 is what an ordinary retina screen can show. ?res=4 goes beyond any display's
        /// own ratio and is really supersampling — see the image-rendering note further down;
        /// on Apple Vision Pro, where devicePixelRatio stays 2 however close you walk up to
        /// the window, that smoothness is the only thing left to gain.
        const tile_scale = (() => {
            const requested = +new URLSearchParams(window.location.search).get('res');
            /// Anything not a positive number (absent, zero, negative, junk) means the plain
            /// CSS-resolution default; Math.log2 would turn it into a NaN tile size otherwise.
            if (!(requested > 0)) return 1;
            /// Only powers of two, because the scale is realized as whole extra zoom levels.
            return Math.min(4, Math.max(1, 2 ** Math.round(Math.log2(requested))));
        })();
        const tile_zoom_shift = Math.log2(tile_scale);

        function showError(text) {
            let err = document.getElementById('error');
            document.getElementById('error-text').textContent = text;
            err.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        document.getElementById('error-close').addEventListener('click', hideError);

        let datasets_elem = document.getElementById('datasets');
        let examples_elem = document.getElementById('examples');
        let active_filter_elem = document.getElementById('active-filter');
        let active_filter_text_elem = document.getElementById('active-filter-text');
        let reports_elem = document.getElementById('report');
        let providers_elem = document.getElementById('provider');

        /// The right-hand buttons (stars, 3D) are added before the dataset buttons, because a
        /// float is placed on the line it appears in: added last, they would sink to the last
        /// line of a wrapped row instead of staying in its top right corner. Of two elements
        /// floated right, the earlier one ends up rightmost, so the stars come first.

        /// GitHub star counter. The count is fetched from the GitHub API and cached in
        /// localStorage, so normal navigation doesn't hit the (rate-limited) API on every
        /// page load.
        let github_stars = document.createElement('a');
        github_stars.id = 'github-stars';
        github_stars.href = 'https://github.com/ClickHouse/adsb.exposed/';
        github_stars.target = '_blank';
        github_stars.rel = 'noopener noreferrer';
        github_stars.title = 'Star adsb.exposed on GitHub';
        github_stars.innerHTML = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg> Star <b id="github-stars-count"></b>`;
        datasets_elem.append(github_stars);

        (function() {
            const repo = 'ClickHouse/adsb.exposed';
            const cache_key = 'github-stars-' + repo;
            const ttl = 6 * 3600 * 1000;
            const count_elem = document.getElementById('github-stars-count');

            try {
                let cached = JSON.parse(localStorage.getItem(cache_key) || 'null');
                if (cached && Date.now() - cached.t < ttl) {
                    count_elem.textContent = cached.n;
                    return;
                }
            } catch (e) {}

            fetch(`https://api.github.com/repos/${repo}`)
                .then(response => response.ok ? response.json() : null)
                .then(data => {
                    if (!data || typeof data.stargazers_count != 'number') return;
                    count_elem.textContent = data.stargazers_count;
                    try {
                        localStorage.setItem(cache_key, JSON.stringify({ n: data.stargazers_count, t: Date.now() }));
                    } catch (e) {}
                })
                .catch(() => {});
        })();

        /// 3D globe toggle, on the right of the datasets row. Switching modes flips the
        /// ?3d URL parameter and reloads, so the choice is remembered in the link and the
        /// app re-initialises cleanly in the chosen mode.
        let toggle_3d = document.createElement('span');
        toggle_3d.id = 'toggle-3d';
        toggle_3d.append(document.createTextNode('🌐 3D'));
        if (is3D) toggle_3d.classList.add('selected');
        toggle_3d.addEventListener('click', () => {
            const params = new URLSearchParams(window.location.search);
            if (is3D) params.delete('3d'); else params.set('3d', '1');
            window.location.search = params.toString();
        });
        datasets_elem.append(toggle_3d);

        datasets_elem.append('Datasets: ');
        Object.keys(datasets).forEach((dataset_name, idx) => {
            let span = document.createElement('span');
            if (!idx) { span.className = 'selected'; }
            span.append(document.createTextNode(dataset_name));
            span.addEventListener('click', e => {
                for (other of document.querySelectorAll('#datasets span')) {
                    if (other.id === 'toggle-3d') continue;   /// Not a dataset choice.
                    other.classList.remove('selected');
                }
                e.target.classList.add('selected');
                switchDataset(dataset_name);
            });
            datasets_elem.append(span);
        });

        function clearContainer(elem) {
            while (elem.firstChild) elem.removeChild(elem.firstChild);
        }

        function switchDataset(name) {
            dataset = name;
            config = datasets[dataset];
            queries = config.queries;
            levels = config.levels;

            resetTimeSlider();

            clearContainer(examples_elem);
            clearContainer(reports_elem);
            clearContainer(providers_elem);

            for (other of datasets_elem.querySelectorAll('span')) {
                if (other.id === 'toggle-3d') continue;   /// Not a dataset choice.
                other.classList.remove('selected');
                if (dataset == other.innerText) {
                    other.classList.add('selected');
                }
            }

            examples_elem.append('Examples: ');
            /// The row was just cleared; put the (floated) filter slab back into it.
            examples_elem.append(active_filter_elem);
            Object.keys(queries).forEach((example, idx) => {
                let span = document.createElement('span');
                if (!idx) {
                    span.className = 'selected';
                    query_elem.value = queries[example];
                    last_selected_example = example;
                }
                span.append(document.createTextNode(example));
                span.addEventListener('click', e => {
                    /// Extract WHERE patch from user's edits before switching.
                    let patch = null;
                    if (last_selected_example && queries[last_selected_example]) {
                        patch = getWherePatch(query_elem.value, queries[last_selected_example]);
                    }

                    for (other of examples_elem.querySelectorAll('.selected')) {
                        other.classList.remove('selected');
                    }
                    e.target.classList.add('selected');
                    last_selected_example = example;

                    let new_query = queries[example];
                    if (patch) {
                        new_query = applyWherePatch(new_query, patch);
                    }
                    setQuery(new_query);
                });
                examples_elem.append(span);
            });

            if (photos_layer_active) {
                photos_layer.removeFrom(map);
                photos_layer_active = false;
            }

            if (name == 'Photos') {
                let span = document.createElement('span');
                span.append(document.createTextNode('🖼️'));
                span.addEventListener('click', e => {
                    e.target.classList.toggle('selected');
                    const on = e.target.classList.contains('selected');
                    if (is3D) {
                        cesiumPhotosActive = on;
                        cesiumUpdatePhotos();
                    } else if (on) {
                        photos_layer.addTo(map);
                        photos_layer_active = true;
                    } else {
                        photos_layer.removeFrom(map);
                        photos_layer_active = false;
                    }
                });
                examples_elem.append(span);
            }

            const report_progress = document.createElement('div');
            report_progress.id = 'report_progress';
            reports_elem.append(report_progress);

            const report_total = document.createElement('div');
            report_total.id = 'report_total';
            reports_elem.append(report_total);

            config.reports.forEach(report => {
                let elem = document.createElement('div');
                elem.id = report.id;
                reports_elem.append(elem);
            });

            let form = document.createElement('form');
            config.endpoints.forEach((endpoint, idx) => {
                let label = document.createElement('label');
                let input = document.createElement('input');
                input.type = 'radio';
                input.name = 'provider';
                input.value = endpoint.name;
                if (!idx) { input.checked = true; } else { form.append(document.createElement('br')); }
                label.append(input);
                label.append(` ${endpoint.name}`);
                form.append(label);
            });
            form.addEventListener('change', e => {
                cached_tiles = {};
                updateMap();
            });

            providers_elem.append(form);
            providers_elem.style.display = config.endpoints.length > 1 ? 'block' : 'none';

            const layer_options = {
                /// The canvas stays 1024x1024; only the area it covers shrinks — see tile_scale.
                tileSize: 1024 / tile_scale,
                minZoom: 2,
                maxZoom: 19,
                minNativeZoom: 2,
                /// The deepest tile ClickHouse is asked for stays the same (z = 14), so the
                /// data ceiling does not move: the shift is compensated here.
                maxNativeZoom: 16 - tile_zoom_shift,
                attribution: `© Alexey Milovidov, ClickHouse, Inc. (data: ${config.notice})`
            };

            layers.forEach(layer => layer.removeFrom(map));
            layers = [];

            levels.forEach((level, idx) => {
                let options = layer_options;
                options.level = level;
                layers.push(new L.GridLayer.ClickHouse(options));
            });

            /// In 3D mode the density tiles are drawn by Cesium, not Leaflet.
            if (!is3D) layers[0].addTo(map);
            layers[0].on('loading', e => {
                layers.forEach((layer, idx) => {
                    if (idx) { layer.removeFrom(map); }
                });
                document.documentElement.style.setProperty('--progress-background-color', 'var(--progress-background-color1)');
                document.documentElement.style.setProperty('--progress-foreground-color', 'var(--progress-foreground-color1)');
            });

            /// Sequential loading for different levels of details

            layers.forEach((layer, idx) => {
                layer.on('load', e => {
                    if (idx + 1 < layers.length) {
                        layers[idx + 1].addTo(map);
                        document.documentElement.style.setProperty('--progress-background-color', `var(--progress-background-color${idx + 2})`);
                        document.documentElement.style.setProperty('--progress-foreground-color', `var(--progress-foreground-color${idx + 2})`);
                    } else {
                        document.documentElement.style.setProperty('--progress-background-color', `var(--progress-background-color-last`);
                        document.documentElement.style.setProperty('--progress-foreground-color', `var(--progress-foreground-color-last`);
                        document.documentElement.style.setProperty('--progress', '0');
                    }
                });
            });

            cached_tiles = {};
            last_tile_image = {};
            updateMap();
        }

        /// The faint outlines under the density layer deserve the same treatment as the
        /// density tiles themselves: half-size tiles one zoom level deeper, so they are drawn
        /// at device resolution rather than CSS resolution. (Spelled out instead of using
        /// Leaflet's `detectRetina`, which additionally decrements maxZoom and would hide the
        /// layer at the map's deepest zoom.) OSM serves nothing past z = 19, hence the clamp;
        /// one extra level is all it can give, so tile_scale = 4 gets no more than 2 does.
        /// Following ?res= also means the free OSM tile server sees no extra load by default.
        const base_retina = tile_scale > 1;
        let base_layer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            tileSize: base_retina ? 128 : 256,
            zoomOffset: base_retina ? 1 : 0,
            minZoom: 2,
            maxZoom: 19,
            maxNativeZoom: base_retina ? 18 : 19,
            attribution: '© OpenStreetMap',
            opacity: 0.1,
        });

        let layers = [];

        let map = L.map('map', {
            center: [52.3676, 4.9041],
            zoom: 5,
            worldCopyJump: true,
            /// In 3D mode the Leaflet map is only kept for camera/URL state; don't
            /// load its raster base (Cesium draws its own).
            layers: is3D ? [] : [base_layer],
            /// Avoid fading tiles in/out so refreshed data replaces the old image cleanly.
            fadeAnimation: false
        });

        map.attributionControl.setPrefix('<a href="https://github.com/ClickHouse/adsb.exposed/">About</a>');

        let query_elem = document.getElementById('query');
        let map_elem = document.getElementById('map');

        /// #map magnifies the tile canvases with `image-rendering: pixelated`, which is what
        /// keeps them crisp. But when ?res= asks for more data pixels than the display has
        /// device pixels, that same nearest-neighbour sampling throws the extra pixels away —
        /// smooth downscaling turns them into antialiasing instead.
        if (tile_scale > (window.devicePixelRatio || 1)) {
            map_elem.style.imageRendering = 'auto';
        }
        let selected_box = [];
        let cached_tiles = {};
        let last_selected_example = null;

        /// Protect from race conditions.
        let report_sequence_num = 0;

        /// Resizing the report panel by dragging its left border.
        ///
        /// The panel is the second column of the body grid, so its width is the width of that
        /// track. The dragged width is written as an inline `grid-template-columns` on the
        /// body — setting the property directly, rather than interpolating a custom property
        /// into it, which is what issue #3 was about. With no width chosen, the inline style
        /// is absent and the stylesheet's `fit-content(20%)` default applies.

        const report_grip_width = parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue('--report-grip-width'));
        /// Enough of the panel to stay readable, and enough of the map to stay usable.
        const report_min_width = 100;
        const map_min_width = 200;

        let report_width = null;    /// null: no explicit width, use the stylesheet default.
        let report_resize = null;
        let report_resize_frame = null;

        function reportMaxWidth() {
            return Math.max(report_min_width, window.innerWidth - map_min_width);
        }

        function applyReportWidth() {
            document.body.style.gridTemplateColumns =
                report_width === null ? '' : `auto ${report_width}px`;
        }

        /// Leaflet caches the map's size, so it has to re-measure while the map column grows
        /// and shrinks, otherwise the newly exposed strip stays blank. Throttled to one call
        /// per frame, because a pointermove can fire several times per frame.
        function reportResizeRedrawMap() {
            if (report_resize_frame !== null) return;
            report_resize_frame = requestAnimationFrame(() => {
                report_resize_frame = null;
                map.invalidateSize({pan: false});
            });
        }

        /// Whether a pointer position falls on the grip, i.e. within the panel's left border.
        function onReportGrip(e) {
            const offset = e.clientX - reports_elem.getBoundingClientRect().left;
            return offset >= 0 && offset < report_grip_width;
        }

        reports_elem.addEventListener('pointerdown', e => {
            if (e.button !== 0 || !onReportGrip(e)) return;

            report_resize = {
                pointer_id: e.pointerId,
                start_x: e.clientX,
                /// The panel may still be at its default width, so measure it rather than
                /// assuming `report_width` is set.
                start_width: reports_elem.getBoundingClientRect().width,
            };
            /// Keep receiving moves after the pointer leaves the (narrow, and moving) border.
            reports_elem.setPointerCapture(e.pointerId);
            document.body.classList.add('report-resizing');
            e.preventDefault();
        });

        reports_elem.addEventListener('pointermove', e => {
            if (!report_resize) {
                reports_elem.classList.toggle('grip', onReportGrip(e));
                return;
            }
            if (e.pointerId !== report_resize.pointer_id) return;

            /// Dragging the left border leftwards widens the panel.
            const width = report_resize.start_width + report_resize.start_x - e.clientX;
            report_width = Math.min(reportMaxWidth(), Math.max(report_min_width, width));
            applyReportWidth();
            reportResizeRedrawMap();
            e.preventDefault();
        });

        function reportResizeStop(e) {
            if (!report_resize || e.pointerId !== report_resize.pointer_id) return;
            const pointer_id = report_resize.pointer_id;
            /// Cleared first: releasing the capture fires `lostpointercapture`, which lands
            /// back here and must not release a capture that is already gone.
            report_resize = null;
            document.body.classList.remove('report-resizing');
            if (reports_elem.hasPointerCapture(pointer_id)) {
                reports_elem.releasePointerCapture(pointer_id);
            }
            map.invalidateSize();
        }

        reports_elem.addEventListener('pointerup', reportResizeStop);
        reports_elem.addEventListener('pointercancel', reportResizeStop);
        reports_elem.addEventListener('lostpointercapture', reportResizeStop);

        /// Double-clicking the grip goes back to the automatic width.
        reports_elem.addEventListener('dblclick', e => {
            if (!onReportGrip(e)) return;
            report_width = null;
            applyReportWidth();
            reportResizeRedrawMap();
        });

        /// A width picked in a wide window can leave no room for the map in a narrow one.
        window.addEventListener('resize', () => {
            if (report_width === null) return;
            const clamped = Math.min(reportMaxWidth(), Math.max(report_min_width, report_width));
            if (clamped === report_width) return;
            report_width = clamped;
            applyReportWidth();
        });

        /// Query editor

        function expandQueryEditor() {
            query_elem.style.height = query_elem.scrollHeight + 'px';
        }

        function collapseQueryEditor() {
            query_elem.style.height = '4.5em';
            query_elem.blur();
        }

        function updateMap() {
            let selected_example = examples_elem.querySelector('.selected');
            if (selected_example && query_elem.value != queries[selected_example.textContent]) {
                selected_example.classList.remove('selected');
            }

            updateActiveFilter();
            updateTimeSlider();

            if (is3D) {
                cesiumRefresh();
            } else {
                layers[0]?.redraw();
                if (photos_layer_active) {
                    photos_layer.redraw();
                }
            }
            if (selected_box.length == 2) showReport();
        }

        /// Extract the WHERE clause content (between WHERE and GROUP BY) from a query.
        function extractWhereClause(query) {
            const match = /WHERE(.+?)GROUP\s+BY/is.exec(query);
            return match ? match[1].trim() : null;
        }

        /// Get user's WHERE clause modifications by comparing with the original example.
        function getWherePatch(currentQuery, originalQuery) {
            const currentWhere = extractWhereClause(currentQuery);
            const originalWhere = extractWhereClause(originalQuery);
            if (!currentWhere || !originalWhere) return null;

            /// Normalize whitespace for comparison.
            const normalize = s => s.replace(/\s+/g, ' ').trim();
            const normCurrent = normalize(currentWhere);
            const normOriginal = normalize(originalWhere);

            if (normCurrent === normOriginal) return null;

            /// Check if the current WHERE starts with the original WHERE content.
            if (normCurrent.startsWith(normOriginal)) {
                return normCurrent.slice(normOriginal.length).trim();
            }

            return null;
        }

        /// Apply a WHERE patch to a new query.
        function applyWherePatch(query, patch) {
            if (!patch) return query;
            return query.replace(/(WHERE\s+.+?)\s*(GROUP\s+BY)/is, '$1 ' + patch + '\n$2');
        }

        /// The example a query came from: an exact match if there is one, otherwise the example
        /// whose WHERE clause this query only extends — that extension is the active filter, and
        /// knowing the example is what makes the filter removable. A shared link carries the SQL
        /// and not the example name, and a query that has a filter on top of it (or was edited,
        /// or was saved before the example itself changed) never matches verbatim, so among the
        /// candidates pick the one sharing the longest prefix with it.
        function findExampleForQuery(query) {
            let best = null;
            let best_prefix = -1;
            for (const name of Object.keys(queries)) {
                if (query == queries[name]) return name;
                if (!getWherePatch(query, queries[name])) continue;
                let prefix = 0;
                while (prefix < query.length && query[prefix] == queries[name][prefix]) ++prefix;
                if (prefix > best_prefix) {
                    best = name;
                    best_prefix = prefix;
                }
            }
            return best;
        }

        /// Set up the examples row for a query that was not chosen by clicking an example: one
        /// restored from a link or from the history. Only an exact match highlights an example;
        /// a query with a filter on top of it is still attributed to it (so that the filter can
        /// be dropped), but the example is not shown as selected.
        function selectExampleForQuery(query) {
            last_selected_example = findExampleForQuery(query);
            for (const example of examples_elem.querySelectorAll('span')) {
                example.classList.toggle('selected', query == queries[example.textContent]);
            }
        }

        /// The conditions narrowing the example's own WHERE clause: either added by clicking
        /// an item in the report (which marks them with a `/* Filter: */` comment), or typed
        /// by hand. The marker is checked first, because it survives sharing a link, while
        /// hand-written conditions can only be recognized by diffing with the example.
        const filter_marker_re = /\/\*\s*Filter:\s*\*\/\s*AND\s+([\s\S]+?)\s*(?=GROUP\s+BY)/i;

        function getActiveFilter() {
            const marked = filter_marker_re.exec(query_elem.value);
            if (marked) return marked[1];

            if (last_selected_example && queries[last_selected_example]) {
                const patch = getWherePatch(query_elem.value, queries[last_selected_example]);
                if (patch) return patch.replace(/^AND\s+/i, '');
            }

            return null;
        }

        /// Show the active filter as a slab in the examples row, or hide the slab if the query
        /// only has the example's own filters.
        function updateActiveFilter() {
            const filter = getActiveFilter();
            if (filter === null) {
                active_filter_elem.style.display = 'none';
                return;
            }
            const text = filter.replace(/\s+/g, ' ');
            active_filter_text_elem.textContent = text;
            active_filter_elem.title = text;
            active_filter_elem.style.display = 'inline-block';
        }

        /// Drop the active filter, keeping the rest of the query (including the user's edits
        /// outside of the WHERE clause) as is.
        function clearFilter() {
            let query = query_elem.value.replace(filter_marker_re, '');

            /// Hand-written conditions have no marker: restore the example's WHERE clause.
            if (last_selected_example && queries[last_selected_example]) {
                const original_where = extractWhereClause(queries[last_selected_example]);
                if (original_where && getWherePatch(query, queries[last_selected_example])) {
                    query = query.replace(/WHERE[\s\S]+?(GROUP\s+BY)/i,
                        (match, group_by) => `WHERE ${original_where}\n${group_by}`);
                }
            }

            setQuery(query);

            /// The filter may have been the only difference from the example: highlight it again.
            for (const example of examples_elem.querySelectorAll('span')) {
                if (queries[example.textContent] === query) {
                    example.classList.add('selected');
                    last_selected_example = example.textContent;
                }
            }
        }

        document.getElementById('active-filter-clear').addEventListener('click', clearFilter);

        function setQuery(value) {
            query_elem.value = value;
            collapseQueryEditor();
            updateMap();
            updateHistory();
        }

        query_elem.addEventListener('input', expandQueryEditor);
        query_elem.addEventListener('focus', expandQueryEditor);
        query_elem.addEventListener('blur', updateMap);
        map_elem.addEventListener('focus', collapseQueryEditor);

        query_elem.addEventListener('keydown', e => {
            /// Firefox has code 13 for Enter and Chromium has code 10.
            if ((event.metaKey || event.ctrlKey) && (event.keyCode == 13 || event.keyCode == 10)) {
                collapseQueryEditor();
                updateMap();
            }
        });

        function getHosts(stick) {
            const provider = providers_elem.querySelector('input[name="provider"]:checked').value;

            return config.endpoints.find(endpoint => endpoint.name == provider).urls.map(url => {
                if (stick && url.sticky) {
                    const hash = sipHash128(JSON.stringify(stick)).substr(0, 3).replace('ad', 'be'); /// Compatibility with AdGuard
                    return url.sticky.replace('{hash}', hash);
                } else {
                    return url.url;
                }
            });
        }

        class CustomError extends Error {
            constructor(message, payload) {
                super(message);
                this.name = this.constructor.name;
                this.payload = payload;
            }
        }

        /// Returns the first successful (HTTP 2xx) response or an error if all of them failed.
        /// Cancels other requests on first success.
        function fetchAny(urls, params) {
            const abort_controllers = {};
            urls.forEach(url => abort_controllers[url] = new AbortController);

            const requests = urls.map(url => {
                const abort_controller = abort_controllers[url];
                params.signal = abort_controller.signal;
                return fetch(url, params).then(response => {
                    if (response.ok) {
                        urls.filter(other => other != url).map(other => abort_controllers[other].abort());
                        return response;
                    }
                    throw new CustomError(response.statusText, response);
                }).catch(error => {
                    return Promise.reject(error);
                })
            });

            return Promise.any(requests);
        }

        function formatReadableSize(bytes) {
            const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB', 'PiB'];
            let value = bytes;
            let i = 0;
            while (value >= 1024 && i < units.length - 1) { value /= 1024; ++i; }
            return `${value.toFixed(i ? 2 : 0)} ${units[i]}`;
        }

        /// Stream a query in the JSONEachRowWithProgress format and reconstruct a plain
        /// object shaped like ClickHouse's JSON format ({data, rows, statistics}) so that
        /// existing report consumers keep working unchanged. Progress packets are delivered
        /// to `onProgress` as they arrive, which lets us drive a live progress bar and show
        /// the elapsed query time once the query finishes.
        async function fetchJSONEachRowWithProgress(urls, params, onProgress) {
            const response = await fetchAny(urls, params);

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            const data = [];
            let last_progress = null;
            let exception = null;
            /// Errors raised after the body already started are framed with an `__exception__`
            /// marker line; once we see it, the rest of the stream is the message, not rows.
            let marker_seen = false;
            let marker_text = '';

            function handleLine(line) {
                const trimmed = line.replace(/\r$/, '');
                if (marker_seen) { marker_text += trimmed + '\n'; return; }
                if (trimmed === '__exception__') { marker_seen = true; return; }
                if (trimmed.trim().length == 0) return;
                let obj;
                try { obj = JSON.parse(trimmed); } catch (e) { return; }
                if (obj.progress) {
                    last_progress = obj.progress;
                    if (onProgress) onProgress(obj.progress);
                } else if (obj.row !== undefined) {
                    data.push(obj.row);
                } else if (obj.exception !== undefined) {
                    exception = obj.exception;
                }
                /// meta/totals/min/max are not used by the reports and are ignored.
            }

            while (true) {
                let done, value;
                try {
                    ({ done, value } = await reader.read());
                } catch (e) {
                    /// After the `__exception__` block the server intentionally breaks the HTTP
                    /// framing, so a network error here is expected — the message is buffered.
                    if (marker_seen) break;
                    throw e;
                }
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const line of lines) handleLine(line);
            }
            if (buffer.length) handleLine(buffer);

            if (exception === null && marker_seen && marker_text.trim().length) {
                exception = marker_text.trim();
            }
            if (exception !== null) throw new Error(exception);

            return {
                data,
                rows: data.length,
                statistics: {
                    rows_read: last_progress ? +last_progress.read_rows : 0,
                    bytes_read: last_progress ? +last_progress.read_bytes : 0,
                    elapsed: last_progress ? +last_progress.elapsed_ns / 1e9 : 0,
                },
                progress: last_progress,
            };
        }

        /// Rendering

        let progress_update_period = null;
        let query_sequence_num = 0;

        /// The last image drawn for each tile position, kept so that when the query or time
        /// window changes we can keep showing the previous image until the new one is loaded
        /// (instead of blinking to blank). Keyed by table + tile coordinates.
        let last_tile_image = {};

        function drawTileBuffer(tile, buf) {
            const ctx = tile.getContext('2d');
            const image = ctx.createImageData(1024, 1024, {colorSpace: 'display-p3'});
            image.data.set(new Uint8ClampedArray(buf));
            ctx.putImageData(image, 0, 0, 0, 0, 1024, 1024);
        }

        /// Surface a failed tile query to the user, unless it is an expected
        /// cancellation caused by a newer request superseding an in-flight one.
        async function reportTileError(error) {
            let text;
            if (error.errors) {
                text = await error.errors[0].payload.text();
            } else {
                console.log(error);
                text = error.toString();
            }
            if (!text.includes('QUERY_WAS_CANCELLED') &&
                !text.includes('QUERY_WITH_SAME_ID_IS_ALREADY_RUNNING')) {
                showError(text);
            }
        }

        /// Fetch the raw 1024x1024 RGBA buffer for one tile from ClickHouse, using the
        /// shared per-query tile cache. Throws on error; the caller decides how to
        /// surface it. Shared by the 2D (Leaflet) and 3D (Cesium) rendering paths.
        ///
        /// `tile` is in ClickHouse tile coordinates (z = 0 is the single world tile), which
        /// the two paths arrive at differently: Leaflet counts its own tiles, Cesium's
        /// tiling scheme happens to already agree. See clickhouseTile() and requestImage().
        async function fetchTileBuffer(level, tile, sql) {
            const key = `${sipHash128(sql)}-${tile.z}-${tile.x}-${tile.y}`;

            if (!config.disable_cache) {
                if (!cached_tiles[key]) cached_tiles[key] = [];
                const cached = cached_tiles[key][level.priority];
                if (cached) return cached;
            }

            ++query_sequence_num;
            const query_id = `${uuid}-${query_sequence_num}-${level.table}-${tile.z}-${tile.x}-${tile.y}`;
            const hosts = getHosts(key);
            const url = host => `${host}/?user=website&default_format=RowBinary` +
                (config.disable_cache ? '&use_query_cache=0' : '') +
                `&query_id=${query_id}&replace_running_query=1` +
                `&param_table=${level.table}&param_sampling=${level.sample}` +
                `&param_z=${tile.z}&param_x=${tile.x}&param_y=${tile.y}`;

            progress_update_period = 1;

            const response = await fetchAny(hosts.map(host => url(host)), { method: 'POST', body: sql });
            const buf = await response.arrayBuffer();
            if (!config.disable_cache) {
                if (!cached_tiles[key]) cached_tiles[key] = [];
                cached_tiles[key][level.priority] = buf;
            }
            return buf;
        }

        /// A Leaflet tile of `1024 / tile_scale` CSS pixels at map zoom z is the ClickHouse
        /// tile of 1024 data pixels at z - 2 + tile_zoom_shift: the map is 256 * 2^z CSS
        /// pixels wide, so the layer holds 2^(z - 2 + tile_zoom_shift) tiles per side.
        function clickhouseTile(coords) {
            return { z: coords.z - 2 + tile_zoom_shift, x: coords.x, y: coords.y };
        }

        async function render(level, coords, tile) {
            /// Each render of a given tile element bumps a token; a slower, superseded
            /// request must not overwrite the tile drawn by a newer one.
            const token = tile._renderToken = (tile._renderToken || 0) + 1;

            const sql = applyTimeWindow(query_elem.value);
            const coord_key = `${level.table}-${coords.z}-${coords.x}-${coords.y}`;

            let buf;
            try {
                buf = await fetchTileBuffer(level, clickhouseTile(coords), sql);
            } catch (error) {
                reportTileError(error);
                return;
            }

            /// A newer render for this tile has started; don't overwrite it with stale data.
            if (tile._renderToken !== token) return;

            drawTileBuffer(tile, buf);
            last_tile_image[coord_key] = buf;

            hideError();
        }

        L.GridLayer.ClickHouse = L.GridLayer.extend({
            createTile: function(coords, done) {
                let tile = L.DomUtil.create('canvas', 'leaflet-tile');
                tile.width = 1024;
                tile.height = 1024;
                /// Keep the previous image visible (no blink) until the new one arrives.
                const level = this.options.level;
                const previous = last_tile_image[`${level.table}-${coords.z}-${coords.x}-${coords.y}`];
                if (previous) drawTileBuffer(tile, previous);
                render(level, coords, tile).then(err => done(err, tile));
                return tile;
            },

            /// Re-render the tiles that are already on screen in place, without removing
            /// them. render() only overwrites each canvas once its new data arrives, so the
            /// current image stays put until then — no blank, and no drop to a coarser layer.
            refreshTiles: function() {
                for (const k in this._tiles) {
                    const t = this._tiles[k];
                    if (t && t.el && t.current) render(this.options.level, t.coords, t.el);
                }
            }
        });

        /// Special layer made of photos.
        async function getTopPhoto(coords) {
            /// This is fairly dirty.
            let condition = /WHERE(.+)GROUP BY/is.exec(query_elem.value)[1];
            const time_cond = getTimeCondition();
            if (time_cond) condition = `(${condition}) AND ${time_cond}`;

            const sql = `WITH
                bitShiftLeft(1::UInt64, 32 - {z:UInt8}) AS tile_size,

                tile_size * {x:UInt32} AS tile_x_begin,
                tile_size * ({x:UInt32} + 1) AS tile_x_end,

                tile_size * {y:UInt32} AS tile_y_begin,
                tile_size * ({y:UInt32} + 1) AS tile_y_end,

                mercator_x >= tile_x_begin AND mercator_x < tile_x_end
                AND mercator_y >= tile_y_begin AND mercator_y < tile_y_end AS in_tile

                SELECT url_sq AS src
                FROM flickr_mercator
                WHERE ${condition} AND has(sizes, 'k')
                ORDER BY count_faves DESC, count_views DESC
                LIMIT 1`;

            ++query_sequence_num;
            const query_id = `${uuid}-${query_sequence_num}-flickr_mercator_top-${coords.z + 2}-${coords.x}-${coords.y}`;
            const hosts = getHosts(`${coords.z}-${coords.x}-${coords.y}`);
            const url = host => `${host}/?user=website&default_format=JSON` +
                `&query_id=${query_id}&replace_running_query=1` +
                `&param_z=${coords.z + 2}&param_x=${coords.x}&param_y=${coords.y}`;

            progress_update_period = 1;

            try {
                const response = await fetchAny(hosts.map(host => url(host)), { method: 'POST', body: sql });
                const json = await response.json();
                if (json.data.length == 1) {
                    return json.data[0].src;
                }
            } catch (error) {
                let text;
                if (error.errors) {
                    const response = error.errors[0].payload;
                    text = await response.text();
                } else {
                    console.log(error);
                    text = error.toString();
                }
                if (!text.includes('QUERY_WAS_CANCELLED') &&
                    !text.includes('QUERY_WITH_SAME_ID_IS_ALREADY_RUNNING')) {
                    showError(text);
                }
            }
        }

        L.GridLayer.Photos = L.GridLayer.extend({
            createTile: function(coords, done) {
                let tile = L.DomUtil.create('img', 'leaflet-tile');
                tile.width = 64;
                tile.height = 64;
                getTopPhoto(coords).then(src => {
                    if (src) {
                        tile.src = src; tile.onload = () => done(null, tile);
                    } else {
                        done(null, tile);
                    }
                });
                return tile;
            }
        });

        let photos_layer_active = false;
        let photos_layer = new L.GridLayer.Photos({
            tileSize: 64,
            minZoom: 2,
            maxZoom: 19,
            minNativeZoom: 2,
            maxNativeZoom: 19,
        });

        /// Time slider
        ///
        /// For datasets that configure a `time` column, we show a histogram of activity by day
        /// below the examples, with two draggable handles that narrow the time window. When the
        /// window is narrowed, the corresponding time condition is added to the main query, the
        /// reports, and the photos overlay. The histogram itself reflects all the other filters
        /// of the main query (the built-in example filters and the user filter), but not the
        /// geographic tile predicate (which is per-tile) and not the time window itself.

        const MS_PER_DAY = 86400000;

        let timeslider_elem = document.getElementById('timeslider');
        let time_canvas = document.getElementById('timeslider-canvas');
        let time_label_elem = document.getElementById('timeslider-label');
        let time_reset_elem = document.getElementById('timeslider-reset');
        let time_hover_elem = document.getElementById('timeslider-hover');

        let time_data = [];            /// [{day, count}], day = integer days since epoch.
        let time_min_day = null;
        let time_max_day = null;
        let time_window = null;        /// {from, to} in day units, or null when the full range is selected.
        let time_hist_cond = null;     /// The last histogram condition, to avoid redundant reloads.
        let time_hist_seq = 0;
        let time_drag = null;          /// 'from' | 'to' | 'move' while dragging.
        let time_drag_anchor = 0;      /// Day under the cursor when a 'move' drag started.
        let time_drag_from0 = 0;       /// Window bounds when a 'move' drag started.
        let time_drag_to0 = 0;
        let time_hover_x = null;       /// Cursor x within the canvas (css px) while hovering, or null.

        function dayToDateStr(day) {
            return new Date(day * MS_PER_DAY).toISOString().slice(0, 10);
        }

        function dateStrToDay(s) {
            return Math.floor(Date.parse(s.length <= 10 ? s + 'T00:00:00Z' : s + 'Z') / MS_PER_DAY);
        }

        /// The time condition to inject into queries, or null when the window is not narrowed.
        function getTimeCondition() {
            if (!config.time || !time_window) return null;
            const col = config.time.column;
            const from = dayToDateStr(time_window.from);
            const to = dayToDateStr(time_window.to + 1); /// Exclusive upper bound, inclusive of the last day.
            return `${col} >= '${from}' AND ${col} < '${to}'`;
        }

        /// Inject the time window into a main tile query, right before its GROUP BY.
        function applyTimeWindow(sql) {
            const cond = getTimeCondition();
            if (!cond) return sql;
            return sql.replace(/(\bWHERE\b[\s\S]*?)(\bGROUP\s+BY\b)/i,
                `$1/* Time: */ AND ${cond}\n$2`);
        }

        /// The WHERE condition for the histogram: the main query's filters without the
        /// geographic tile predicate (which is replaced by a constant true).
        function getHistogramCondition() {
            const m = /\bWHERE\b([\s\S]+?)\bGROUP\s+BY\b/i.exec(query_elem.value);
            if (!m) return '1';
            return m[1].replace(/\bin_tile\b/, '1').trim();
        }

        function resetTimeSlider() {
            time_window = null;
            time_hist_cond = null;
            time_min_day = null;
            time_max_day = null;
            time_data = [];
            time_drag = null;
            time_reset_elem.style.display = 'none';
            time_label_elem.textContent = '';
        }

        function updateTimeSlider() {
            /// Showing/hiding the slider changes the map's height, so Leaflet must re-measure,
            /// otherwise it keeps the stale size and leaves part of the map unloaded.
            const want = config.time ? 'block' : 'none';
            if (timeslider_elem.style.display !== want) {
                timeslider_elem.style.display = want;
                if (typeof map !== 'undefined' && map) map.invalidateSize();
            }
            if (!config.time) return;

            /// Reload when either the query filters or the selected rectangle change.
            const sig = getHistogramSignature();
            if (sig !== time_hist_cond) {
                time_hist_cond = sig;
                loadHistogram();
            } else {
                drawHistogram();
            }
        }

        /// The geographic bounds of the current rectangular selection, or null.
        function getSelectionBounds() {
            if (selected_box.length != 2) return null;
            return {
                left: Math.min(selected_box[0].x, selected_box[1].x),
                right: Math.max(selected_box[0].x, selected_box[1].x),
                top: Math.min(selected_box[0].y, selected_box[1].y),
                bottom: Math.max(selected_box[0].y, selected_box[1].y),
            };
        }

        function getHistogramSignature() {
            const b = getSelectionBounds();
            return getHistogramCondition() + '|' + (b ? `${b.left},${b.right},${b.top},${b.bottom}` : '');
        }

        async function loadHistogram() {
            ++time_hist_seq;
            const seq = time_hist_seq;

            const col = config.time.column;
            const cond = getHistogramCondition();
            const exclude = config.time.exclude ? ` AND (${config.time.exclude})` : '';

            /// Read the cheapest (most-sampled) table. With a rectangular selection we return,
            /// per day, both the count inside the area and the total (without the selection),
            /// from the same sampled table, so the ratio between them is unbiased. Without a
            /// selection we just return the daily totals.
            const bounds = getSelectionBounds();
            const table = config.levels[0].table;
            const geoParams = bounds
                ? `&param_left=${bounds.left}&param_right=${bounds.right}&param_top=${bounds.top}&param_bottom=${bounds.bottom}`
                : '';

            const selectExpr = bounds
                ? `countIf(mercator_x >= {left:UInt32} AND mercator_x < {right:UInt32}` +
                  ` AND mercator_y >= {top:UInt32} AND mercator_y < {bottom:UInt32}) AS area, count() AS total`
                : `count() AS c`;

            const sql = `SELECT toInt32(toDate32(${col})) AS d, ${selectExpr}
                FROM {table:Identifier}
                WHERE (${cond})${exclude}
                GROUP BY d ORDER BY d`;

            const query_id = `${uuid}-timeslider-${seq}`;
            const hosts = getHosts('timeslider');
            /// The histogram covers the whole time range including today, so a long-lived cache
            /// entry would keep showing yesterday's picture for the most recent days. Cap the
            /// lifetime of these entries at one hour; the query is cheap enough to redo.
            const url = host => `${host}/?user=website&default_format=JSON` +
                (config.disable_cache ? '&use_query_cache=0' : '&query_cache_ttl=3600') +
                `&query_id=${query_id}&replace_running_query=1&param_table=${table}${geoParams}`;

            progress_update_period = 1;

            try {
                const response = await fetchAny(hosts.map(host => url(host)), { method: 'POST', body: sql });
                const json = await response.json();
                if (seq != time_hist_seq) return;
                processHistogram(json.data);
            } catch (error) {
                let text;
                if (error.errors) {
                    text = await error.errors[0].payload.text();
                } else {
                    text = error.toString();
                }
                if (!text.includes('QUERY_WAS_CANCELLED') &&
                    !text.includes('QUERY_WITH_SAME_ID_IS_ALREADY_RUNNING')) {
                    console.log('Time slider:', text);
                }
            }
        }

        /// How strongly to damp days with few total observations when showing the area's
        /// share of the totals: the smoothing constant is this fraction of the busiest day's
        /// total, added to each day's denominator so low-count days don't turn into noise.
        const TIME_SMOOTHING = 0.03;

        function processHistogram(data) {
            const rows = data
                .filter(r => r.d !== null)
                .map(r => r.total !== undefined
                    ? { day: Number(r.d), area: Number(r.area), total: Number(r.total) }
                    : { day: Number(r.d), count: Number(r.c) })
                .filter(r => Number.isFinite(r.day));

            if (rows.length && rows[0].total !== undefined) {
                /// Selection mode: plot the area's share of the totals, area / (total + k).
                let maxTotal = 0;
                for (const r of rows) if (r.total > maxTotal) maxTotal = r.total;
                const k = maxTotal * TIME_SMOOTHING;
                time_data = rows.map(r => ({ day: r.day, count: r.total + k > 0 ? r.area / (r.total + k) : 0 }));
            } else {
                time_data = rows;
            }

            if (!time_data.length) {
                time_min_day = null;
                time_max_day = null;
                drawHistogram();
                updateTimeLabel();
                return;
            }

            time_min_day = time_data[0].day;
            time_max_day = time_data[time_data.length - 1].day;

            /// Clamp a restored/existing window to the available range.
            if (time_window) {
                time_window.from = Math.max(time_min_day, Math.min(time_window.from, time_max_day));
                time_window.to = Math.max(time_window.from, Math.min(time_window.to, time_max_day));
                normalizeWindow();
            }

            time_reset_elem.style.display = time_window ? 'block' : 'none';
            drawHistogram();
            updateTimeLabel();
        }

        function dayToX(day, w) {
            const nDays = time_max_day - time_min_day + 1;
            return (day - time_min_day) / nDays * w;
        }

        function xToDay(clientX) {
            const rect = time_canvas.getBoundingClientRect();
            const nDays = time_max_day - time_min_day + 1;
            const frac = (clientX - rect.left) / rect.width;
            return time_min_day + Math.round(frac * nDays - 0.5);
        }

        /// How far from a window edge (css px) the pointer still grabs that edge's handle.
        const TIME_HANDLE_GRAB = 12;
        /// The central band that drags the window as a whole is never thinner than this, so a
        /// narrow window (down to a single day) can still be moved and not only resized.
        const TIME_MOVE_BAND = 14;

        /// What a drag starting at `x` (css px within the canvas) would do:
        /// 'from' | 'to' (resize that edge), 'move' (shift the window), 'new' (fresh selection).
        function timeZoneAt(x, w) {
            const winFrom = time_window ? time_window.from : time_min_day;
            const winTo = time_window ? time_window.to : time_max_day;
            const xL = dayToX(winFrom, w);
            const xR = dayToX(winTo + 1, w);

            /// The middle of the window wins over the handles: when the window is thin the
            /// handles are still reachable from just outside it, while the middle would not be
            /// reachable at all. For a wide window this is exactly the interior minus the
            /// handle zones, as before.
            if (time_window) {
                const half = Math.max(TIME_MOVE_BAND / 2, (xR - xL) / 2 - TIME_HANDLE_GRAB);
                if (Math.abs(x - (xL + xR) / 2) <= half) return 'move';
            }

            const dL = Math.abs(x - xL);
            const dR = Math.abs(x - xR);
            if (Math.min(dL, dR) <= TIME_HANDLE_GRAB) return dL <= dR ? 'from' : 'to';
            return 'new';
        }

        function drawHistogram() {
            const dpr = window.devicePixelRatio || 1;
            const cssW = time_canvas.clientWidth;
            const cssH = time_canvas.clientHeight;
            if (!cssW || !cssH) return;

            time_canvas.width = Math.round(cssW * dpr);
            time_canvas.height = Math.round(cssH * dpr);

            const ctx = time_canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssW, cssH);
            if (time_min_day === null) return;

            const nDays = time_max_day - time_min_day + 1;
            const nBuckets = Math.max(1, Math.min(nDays, Math.floor(cssW)));
            const buckets = new Float64Array(nBuckets);
            for (const r of time_data) {
                const b = Math.min(nBuckets - 1, Math.floor((r.day - time_min_day) / nDays * nBuckets));
                buckets[b] += r.count;
            }

            let maxC = 0;
            for (const v of buckets) if (v > maxC) maxC = v;

            /// Rectangular (bar-chart-like) profile: gray bar bodies, brighter-gray vertical
            /// step edges between neighbours, and yellow tops. Buckets inside the selected
            /// window are drawn with brighter grays so the selection reads as "lit up".
            const bw = cssW / nBuckets;
            const xEdge = b => Math.round(b * bw);
            const yTop = b => Math.round(cssH - 1 - (maxC > 0 ? Math.pow(buckets[b] / maxC, 0.5) : 0) * (cssH - 2));

            const winFrom = time_window ? time_window.from : time_min_day;
            const winTo = time_window ? time_window.to : time_max_day;
            const xL = dayToX(winFrom, cssW);
            const xR = dayToX(winTo + 1, cssW);
            /// Only brighten when a window is actually narrowed; the default (full-range)
            /// view keeps its normal colors.
            const inside = x => time_window && x >= xL && x < xR;

            /// Bar bodies.
            for (let b = 0; b < nBuckets; ++b) {
                const x0 = xEdge(b), x1 = xEdge(b + 1), y = yTop(b);
                ctx.fillStyle = inside((x0 + x1) / 2) ? '#5f5f5f' : '#333';
                ctx.fillRect(x0, y, Math.max(1, x1 - x0), cssH - y);
            }

            /// Vertical step edges between neighbours.
            for (let b = 1; b < nBuckets; ++b) {
                const x = xEdge(b), y0 = yTop(b - 1), y1 = yTop(b);
                ctx.fillStyle = inside(x) ? '#adadad' : '#777';
                ctx.fillRect(x, Math.min(y0, y1), 1, Math.abs(y1 - y0) + 1);
            }

            /// Yellow tops, drawn last and spanning both boundary columns so the corner
            /// pixels belong to the top line rather than to the vertical edges.
            ctx.fillStyle = '#faff69';
            for (let b = 0; b < nBuckets; ++b) {
                const x0 = xEdge(b);
                ctx.fillRect(x0, yTop(b), xEdge(b + 1) - x0 + 1, 1);
            }

            /// Dim the region outside the selected window and draw the handles.
            ctx.fillStyle = 'rgba(16, 18, 19, 0.6)';
            if (xL > 0) ctx.fillRect(0, 0, xL, cssH);
            if (xR < cssW) ctx.fillRect(xR, 0, cssW - xR, cssH);

            ctx.fillStyle = '#faff69';
            ctx.fillRect(xL - 1, 0, 2, cssH);
            ctx.fillRect(xR - 1, 0, 2, cssH);
            const gh = Math.min(14, cssH);
            ctx.fillRect(xL - 3, (cssH - gh) / 2, 6, gh);
            ctx.fillRect(xR - 3, (cssH - gh) / 2, 6, gh);

            /// Hover cursor line.
            if (time_hover_x !== null) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
                ctx.fillRect(time_hover_x - 0.5, 0, 1, cssH);
            }
        }

        function updateTimeLabel() {
            if (time_min_day === null) {
                time_label_elem.textContent = '';
                return;
            }
            if (time_window) {
                time_label_elem.textContent = `${dayToDateStr(time_window.from)} — ${dayToDateStr(time_window.to)}`;
            } else {
                time_label_elem.textContent = `${dayToDateStr(time_min_day)} — ${dayToDateStr(time_max_day)}`;
            }
        }

        /// Collapse a full-range window back to "not narrowed".
        function normalizeWindow() {
            if (time_window &&
                time_window.from <= time_min_day &&
                time_window.to >= time_max_day) {
                time_window = null;
            }
        }

        function applyTimeSelection() {
            normalizeWindow();
            time_reset_elem.style.display = time_window ? 'block' : 'none';
            drawHistogram();
            updateTimeLabel();
            /// Refresh the map in place so the previous image stays until the new data for
            /// the changed time window arrives (no blink, no drop to a coarser layer).
            if (is3D) {
                cesiumRefresh();
            } else {
                layers.forEach(layer => { if (map.hasLayer(layer)) layer.refreshTiles(); });
                if (photos_layer_active) photos_layer.redraw();
            }
            if (selected_box.length == 2) showReport();
            updateHistory();
        }

        time_canvas.addEventListener('pointerdown', e => {
            if (time_min_day === null) return;

            const rect = time_canvas.getBoundingClientRect();
            const zone = timeZoneAt(e.clientX - rect.left, rect.width);

            if (zone === 'move') {
                /// The middle of the selected window: drag it as a whole.
                time_drag = 'move';
                time_drag_anchor = xToDay(e.clientX);
                time_drag_from0 = time_window.from;
                time_drag_to0 = time_window.to;
                time_canvas.style.cursor = 'grabbing';
            } else if (zone === 'new') {
                /// Start a fresh selection from the clicked point.
                const day = Math.max(time_min_day, Math.min(time_max_day, xToDay(e.clientX)));
                time_window = { from: day, to: day };
                time_drag = 'to';
                time_canvas.style.cursor = 'ew-resize';
            } else {
                /// Grab the nearer existing handle.
                time_drag = zone;
                time_canvas.style.cursor = 'ew-resize';
            }

            time_canvas.setPointerCapture(e.pointerId);
            drawHistogram();
            updateTimeLabel();
            e.preventDefault();
        });

        /// Show the vertical cursor line and the date under the pointer.
        function showTimeHover(clientX, rect) {
            const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
            time_hover_x = x;
            const day = Math.max(time_min_day, Math.min(time_max_day, xToDay(clientX)));
            time_hover_elem.textContent = dayToDateStr(day);
            time_hover_elem.style.display = 'block';
            /// The label is centered on the cursor; keep it fully within the chart so it
