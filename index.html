<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" href="favicon.png">
    <title>ADS-B Massive Visualizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        :root {
            --progress: 0%;
            --progress-background-color1: #320;
            --progress-foreground-color1: #840;

            --progress-background-color2: #330;
            --progress-foreground-color2: #880;

            --progress-background-color3: #033;
            --progress-foreground-color3: #088;

            --progress-background-color-last: #333;
            --progress-foreground-color-last: #666;

            --progress-background-color: var(--progress-background-color4);
            --progress-foreground-color: var(--progress-foreground-color4);

            --report-width: 0%;
        }
        * {
            box-sizing: border-box;
        }

        html, body {
            background: #101213;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            scrollbar-color: #333 black;
        }

        body {
            display: grid;
            grid-template-columns: auto var(--report-width);
            grid-template-rows: fit-content(2em) fit-content(2em) fit-content(10%) fit-content(2em) fit-content(2.6em) 1em auto;
            grid-gap: 0;
        }

        #proud {
            grid-column: span 2;
            font-family: sans-serif;
            font-size: 14pt;
            background: linear-gradient(
                90deg,
                white 0%,
                white 15%,
                yellow 50%,
                white 85%,
                white 100%
            );
            color: black;
            text-align: center;
            padding: 0.125em;
            text-decoration: none;
        }

        #proud:hover {
            background: linear-gradient(
                90deg,
                yellow 0%,
                yellow 15%,
                white 50%,
                yellow 85%,
                yellow 100%
            );
        }

        #query {
            grid-column: span 2;
            width: 100%;
            min-width: 100%;
            max-width: 100vw;
            height: 4.5em;
            max-height: 50vh;
            margin: 0;
            padding: .5em;
            outline: none;
            border: none;
            background: #101213;
            color: lightgray;
            font-size: 14pt;
            border-bottom: 1px #333 solid;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #111;
            image-rendering: pixelated;
            position: relative;
        }

        /* The 3D globe overlays the Leaflet map, taking over its (grid-sized) area. */
        #cesium {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 1000;
            image-rendering: auto;
        }

        .leaflet-fade-anim .leaflet-popup {
            transition: none;
            font-family: monospace;
        }

        .leaflet-control-attribution {
            font-size: 12pt;
        }

        #error {
            display: none;
            position: absolute;
            z-index: 1001;
            bottom: max(5%, 1em);
            left: 50%;
            transform: translate(-50%, 0);
            background: #300;
            color: white;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 16pt;
            padding: 1em;
            padding-right: 2em;
            min-width: 50%;
            max-width: 80%;
        }

        #error-close {
            position: absolute;
            top: 0;
            right: 0;
            padding: 0 .4em;
            font-size: 20pt;
            line-height: 1.2em;
            cursor: pointer;
            user-select: none;
            color: #f99;
        }

        #error-close:hover {
            color: white;
        }

        #selection {
            display: none;
            position: absolute;
            z-index: 1001;
            border: 1px dashed white;
            backdrop-filter: brightness(150%);
            -webkit-backdrop-filter: brightness(150%); /* Safari */
        }

        #timeslider {
            grid-column: span 2;
            position: relative;
            display: block;
            background: #181a1b;
            height: 2.6em;
            padding: 0;
            overflow: hidden;
            font-family: monospace;
            color: #aaa;
            user-select: none;
        }

        #timeslider-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: ew-resize;
            touch-action: none;
        }

        #timeslider-title {
            position: absolute;
            left: 0.5em;
            top: 0.2em;
            font-size: 10pt;
            color: #bbb;
            pointer-events: none;
            z-index: 2;
            text-shadow: 0 1px 2px #000, 0 0 4px #000, 0 0 4px #000;
        }

        #timeslider-label {
            color: #eee;
            white-space: nowrap;
            text-shadow: 0 1px 2px #000, 0 0 4px #000, 0 0 4px #000;
        }

        #timeslider-hover {
            position: absolute;
            bottom: 0.05em;
            display: none;
            transform: translateX(-50%);
            font-size: 9pt;
            color: #fff;
            background: rgba(16, 18, 19, 0.85);
            padding: 0 0.3em;
            border-radius: 2px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 3;
            text-shadow: 0 0 2px #000;
        }

        #timeslider-reset {
            position: absolute;
            right: 0.4em;
            top: 0.1em;
            z-index: 2;
            display: none;
            background: #444;
            color: white;
            font-size: 10pt;
            padding: 0.1em 0.5em;
            border: solid 0.125em black;
            cursor: pointer;
        }

        #timeslider-reset:hover {
            background: yellow;
            color: black;
        }

        #stats {
            grid-column: span 2;
            background: linear-gradient(to right,
                var(--progress-background-color) 0%,
                var(--progress-foreground-color) var(--progress),
                var(--progress-background-color) var(--progress));
            color: white;
            padding-right: .5em;
            font-family: monospace;
            text-align: right;
        }

        .choices {
            grid-column: span 2;
            background: #202020;
            color: white;
            font-size: 12pt;
            font-family: monospace;
            padding: .125em .5em;
        }

        .choices span {
            display: inline-block;
            padding: .25em .5em;
            background: #444;
            border: solid 0.125em black;
            user-select: none;
        }

        .choices span:hover, .choices span.selected:hover {
            color: black;
            background: yellow;
            cursor: pointer;
        }

        .choices span.selected {
            background: #FFF;
            color: #000;
        }

        #toggle-3d {
            float: right;
        }

        #report {
            color: white;
            font-size: 12pt;
            font-family: monospace;
            background: #202020;
            padding: .5em;
            display: none;
            max-height: 100%;
            overflow-y: scroll;
        }

        #report div {
            margin-bottom: 1em;
            white-space: pre-wrap;
            color: lightgray;
        }

        #report a {
            color: white;
            border-bottom: 1px dashed #888;
            cursor: pointer;
        }

        #report a:hover {
            color: yellow;
            background: black;
            border-bottom: 1px dashed yellow;
            box-shadow: 0px 0px 10px rgba(0,0,0,1);
            font-weight: bold;
        }

        #picture {
            position: absolute;
            left: 1em;
            bottom: 4em;
            font-size: 16pt;
            z-index: 1001;
            display: none;
            box-shadow: 2px 2px 10px rgba(0,0,0,1);
            line-height: 0;
            min-width: 500px;
            min-height: 1em;
        }

        #picture-copyright {
            position: absolute;
            left: 0;
            bottom: 0;
            font-family: sans-serif;
            font-size: 12pt;
            line-height: 1;
            background: rgba(255, 255, 255, 0.5);
        }

        #picture-copyright a {
            text-decoration: none;
            color: #088;
        }

        #layers, #provider, #select {
            position: absolute;
            padding: .3em .5em .2em .5em;
            font-family: monospace;
            color: black;
            background: lightgray;
            box-shadow: 2px 2px 10px rgba(0,0,0,1);
            z-index: 1001;
            user-select: none;
        }

        #layers:hover, #provider:hover, #select:hover {
            filter: brightness(125%);
        }

        #layers {
            left: 1em;
            bottom: 1em;
            width: 2em;
            height: 2em;
            padding: .3em .5em .2em .5em;
            font-size: 16pt;
            text-align: center;
            cursor: pointer;
        }

        #select {
            left: 4em;
            bottom: 1em;
            width: 2em;
            height: 2em;
            padding: .3em .5em .2em .5em;
            font-size: 16pt;
            text-align: center;
            cursor: pointer;
        }

        #select img {
            padding-top: 13%;
            width: 120%;
        }

        #provider {
            right: 0.25em;
            bottom: 1.25em;
            height: 3em;
            padding: 0.1em .3em 0.1em 0.3em;
            font-size: 16pt;
        }

        #provider form {
            font-size: 12pt;
            color: #333;
        }

        #provider * {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <a id="proud" href="https://github.com/ClickHouse/ClickHouse">Proudly made with <b>ClickHouse</b> open-source database</a>
    <div id="datasets" class="choices"></div>
    <textarea spellcheck="false" data-gramm="false" id="query"></textarea>
    <div id="examples" class="choices"></div>
    <div id="timeslider">
        <span id="timeslider-title">Time: <span id="timeslider-label"></span></span>
        <span id="timeslider-reset">Reset</span>
        <canvas id="timeslider-canvas"></canvas>
        <span id="timeslider-hover"></span>
    </div>
    <div id="stats"></div>
    <div id="map"><div id="selection"></div><div id="cesium"></div></div>
    <div id="report"></div>
    <div id="picture"><img/><span id="picture-copyright">Picture from Wikipedia, &copy; the details at the corresponding page.</span></div>
    <div id="error"><span id="error-close" title="Close">&times;</span><span id="error-text"></span></div>
    <div id="layers">👁</div>
    <div id="select"><img src="pointer.svg"/></div>

    <div id="provider"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="config.js"></script>
    <script>
        let uuid = crypto.randomUUID();

        let dataset;
        let config;
        let queries;
        let levels;

        /// Experimental 3D globe mode (CesiumJS), hidden behind ?3d=1. See the block
        /// near the end of this script. When active, the density tiles are draped over
        /// a real sphere instead of a flat Mercator plane.
        const is3D = new URLSearchParams(window.location.search).get('3d') == '1';
        let cesiumViewer = null;
        let cesiumDensityLayer = null;

        function showError(text) {
            let err = document.getElementById('error');
            document.getElementById('error-text').textContent = text;
            err.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        document.getElementById('error-close').addEventListener('click', hideError);

        let datasets_elem = document.getElementById('datasets');
        let examples_elem = document.getElementById('examples');
        let reports_elem = document.getElementById('report');
        let providers_elem = document.getElementById('provider');

        datasets_elem.append('Datasets: ');
        Object.keys(datasets).forEach((dataset_name, idx) => {
            let span = document.createElement('span');
            if (!idx) { span.className = 'selected'; }
            span.append(document.createTextNode(dataset_name));
            span.addEventListener('click', e => {
                for (other of document.querySelectorAll('#datasets span')) {
                    if (other.id === 'toggle-3d') continue;   /// Not a dataset choice.
                    other.classList.remove('selected');
                }
                e.target.classList.add('selected');
                switchDataset(dataset_name);
            });
            datasets_elem.append(span);
        });

        /// 3D globe toggle, on the right of the datasets row. Switching modes flips the
        /// ?3d URL parameter and reloads, so the choice is remembered in the link and the
        /// app re-initialises cleanly in the chosen mode.
        let toggle_3d = document.createElement('span');
        toggle_3d.id = 'toggle-3d';
        toggle_3d.append(document.createTextNode('🌐 3D'));
        if (is3D) toggle_3d.classList.add('selected');
        toggle_3d.addEventListener('click', () => {
            const params = new URLSearchParams(window.location.search);
            if (is3D) params.delete('3d'); else params.set('3d', '1');
            window.location.search = params.toString();
        });
        datasets_elem.append(toggle_3d);

        function clearContainer(elem) {
            while (elem.firstChild) elem.removeChild(elem.firstChild);
        }

        function switchDataset(name) {
            dataset = name;
            config = datasets[dataset];
            queries = config.queries;
            levels = config.levels;

            resetTimeSlider();

            clearContainer(examples_elem);
            clearContainer(reports_elem);
            clearContainer(providers_elem);

            for (other of datasets_elem.querySelectorAll('span')) {
                if (other.id === 'toggle-3d') continue;   /// Not a dataset choice.
                other.classList.remove('selected');
                if (dataset == other.innerText) {
                    other.classList.add('selected');
                }
            }

            examples_elem.append('Examples: ');
            Object.keys(queries).forEach((example, idx) => {
                let span = document.createElement('span');
                if (!idx) {
                    span.className = 'selected';
                    query_elem.value = queries[example];
                    last_selected_example = example;
                }
                span.append(document.createTextNode(example));
                span.addEventListener('click', e => {
                    /// Extract WHERE patch from user's edits before switching.
                    let patch = null;
                    if (last_selected_example && queries[last_selected_example]) {
                        patch = getWherePatch(query_elem.value, queries[last_selected_example]);
                    }

                    for (other of examples_elem.querySelectorAll('.selected')) {
                        other.classList.remove('selected');
                    }
                    e.target.classList.add('selected');
                    last_selected_example = example;

                    let new_query = queries[example];
                    if (patch) {
                        new_query = applyWherePatch(new_query, patch);
                    }
                    setQuery(new_query);
                });
                examples_elem.append(span);
            });

            if (photos_layer_active) {
                photos_layer.removeFrom(map);
                photos_layer_active = false;
            }

            if (name == 'Photos') {
                let span = document.createElement('span');
                span.append(document.createTextNode('🖼️'));
                span.addEventListener('click', e => {
                    e.target.classList.toggle('selected');
                    const on = e.target.classList.contains('selected');
                    if (is3D) {
                        cesiumPhotosActive = on;
                        cesiumUpdatePhotos();
                    } else if (on) {
                        photos_layer.addTo(map);
                        photos_layer_active = true;
                    } else {
                        photos_layer.removeFrom(map);
                        photos_layer_active = false;
                    }
                });
                examples_elem.append(span);
            }

            const report_total = document.createElement('div');
            report_total.id = 'report_total';
            reports_elem.append(report_total);

            config.reports.forEach(report => {
                let elem = document.createElement('div');
                elem.id = report.id;
                reports_elem.append(elem);
            });

            let form = document.createElement('form');
            config.endpoints.forEach((endpoint, idx) => {
                let label = document.createElement('label');
                let input = document.createElement('input');
                input.type = 'radio';
                input.name = 'provider';
                input.value = endpoint.name;
                if (!idx) { input.checked = true; } else { form.append(document.createElement('br')); }
                label.append(input);
                label.append(` ${endpoint.name}`);
                form.append(label);
            });
            form.addEventListener('change', e => {
                cached_tiles = {};
                updateMap();
            });

            providers_elem.append(form);
            providers_elem.style.display = config.endpoints.length > 1 ? 'block' : 'none';

            const layer_options = {
                tileSize: 1024,
                minZoom: 2,
                maxZoom: 19,
                minNativeZoom: 2,
                maxNativeZoom: 16,
                attribution: `© Alexey Milovidov, ClickHouse, Inc. (data: ${config.notice})`
            };

            layers.forEach(layer => layer.removeFrom(map));
            layers = [];

            levels.forEach((level, idx) => {
                let options = layer_options;
                options.level = level;
                layers.push(new L.GridLayer.ClickHouse(options));
            });

            /// In 3D mode the density tiles are drawn by Cesium, not Leaflet.
            if (!is3D) layers[0].addTo(map);
            layers[0].on('loading', e => {
                layers.forEach((layer, idx) => {
                    if (idx) { layer.removeFrom(map); }
                });
                document.documentElement.style.setProperty('--progress-background-color', 'var(--progress-background-color1)');
                document.documentElement.style.setProperty('--progress-foreground-color', 'var(--progress-foreground-color1)');
            });

            /// Sequential loading for different levels of details

            layers.forEach((layer, idx) => {
                layer.on('load', e => {
                    if (idx + 1 < layers.length) {
                        layers[idx + 1].addTo(map);
                        document.documentElement.style.setProperty('--progress-background-color', `var(--progress-background-color${idx + 2})`);
                        document.documentElement.style.setProperty('--progress-foreground-color', `var(--progress-foreground-color${idx + 2})`);
                    } else {
                        document.documentElement.style.setProperty('--progress-background-color', `var(--progress-background-color-last`);
                        document.documentElement.style.setProperty('--progress-foreground-color', `var(--progress-foreground-color-last`);
                        document.documentElement.style.setProperty('--progress', '0');
                    }
                });
            });

            cached_tiles = {};
            last_tile_image = {};
            updateMap();
        }

        let base_layer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            zoomOffset: 0,
            minZoom: 2,
            maxZoom: 19,
            attribution: '© OpenStreetMap',
            opacity: 0.1,
        });

        let layers = [];

        let map = L.map('map', {
            center: [52.3676, 4.9041],
            zoom: 5,
            worldCopyJump: true,
            /// In 3D mode the Leaflet map is only kept for camera/URL state; don't
            /// load its raster base (Cesium draws its own).
            layers: is3D ? [] : [base_layer],
            /// Avoid fading tiles in/out so refreshed data replaces the old image cleanly.
            fadeAnimation: false
        });

        map.attributionControl.setPrefix('<a href="https://github.com/ClickHouse/adsb.exposed/">About</a>');

        let query_elem = document.getElementById('query');
        let map_elem = document.getElementById('map');
        let selected_box = [];
        let cached_tiles = {};
        let last_selected_example = null;

        /// Protect from race conditions.
        let report_sequence_num = 0;

        /// Query editor

        function expandQueryEditor() {
            query_elem.style.height = query_elem.scrollHeight + 'px';
        }

        function collapseQueryEditor() {
            query_elem.style.height = '4.5em';
            query_elem.blur();
        }

        function updateMap() {
            let selected_example = examples_elem.querySelector('.selected');
            if (selected_example && query_elem.value != queries[selected_example.textContent]) {
                selected_example.classList.remove('selected');
            }

            updateTimeSlider();

            if (is3D) {
                cesiumRefresh();
            } else {
                layers[0]?.redraw();
                if (photos_layer_active) {
                    photos_layer.redraw();
                }
            }
            if (selected_box.length == 2) showReport();
        }

        /// Extract the WHERE clause content (between WHERE and GROUP BY) from a query.
        function extractWhereClause(query) {
            const match = /WHERE(.+?)GROUP\s+BY/is.exec(query);
            return match ? match[1].trim() : null;
        }

        /// Get user's WHERE clause modifications by comparing with the original example.
        function getWherePatch(currentQuery, originalQuery) {
            const currentWhere = extractWhereClause(currentQuery);
            const originalWhere = extractWhereClause(originalQuery);
            if (!currentWhere || !originalWhere) return null;

            /// Normalize whitespace for comparison.
            const normalize = s => s.replace(/\s+/g, ' ').trim();
            const normCurrent = normalize(currentWhere);
            const normOriginal = normalize(originalWhere);

            if (normCurrent === normOriginal) return null;

            /// Check if the current WHERE starts with the original WHERE content.
            if (normCurrent.startsWith(normOriginal)) {
                return normCurrent.slice(normOriginal.length).trim();
            }

            return null;
        }

        /// Apply a WHERE patch to a new query.
        function applyWherePatch(query, patch) {
            if (!patch) return query;
            return query.replace(/(WHERE\s+.+?)\s*(GROUP\s+BY)/is, '$1 ' + patch + '\n$2');
        }

        function setQuery(value) {
            query_elem.value = value;
            collapseQueryEditor();
            updateMap();
            updateHistory();
        }

        query_elem.addEventListener('input', expandQueryEditor);
        query_elem.addEventListener('focus', expandQueryEditor);
        query_elem.addEventListener('blur', updateMap);
        map_elem.addEventListener('focus', collapseQueryEditor);

        query_elem.addEventListener('keydown', e => {
            /// Firefox has code 13 for Enter and Chromium has code 10.
            if ((event.metaKey || event.ctrlKey) && (event.keyCode == 13 || event.keyCode == 10)) {
                collapseQueryEditor();
                updateMap();
            }
        });

        function getHosts(stick) {
            const provider = providers_elem.querySelector('input[name="provider"]:checked').value;

            return config.endpoints.find(endpoint => endpoint.name == provider).urls.map(url => {
                if (stick && url.sticky) {
                    const hash = sipHash128(JSON.stringify(stick)).substr(0, 3).replace('ad', 'be'); /// Compatibility with AdGuard
                    return url.sticky.replace('{hash}', hash);
                } else {
                    return url.url;
                }
            });
        }

        class CustomError extends Error {
            constructor(message, payload) {
                super(message);
                this.name = this.constructor.name;
                this.payload = payload;
            }
        }

        /// Returns the first successful (HTTP 2xx) response or an error if all of them failed.
        /// Cancels other requests on first success.
        function fetchAny(urls, params) {
            const abort_controllers = {};
            urls.forEach(url => abort_controllers[url] = new AbortController);

            const requests = urls.map(url => {
                const abort_controller = abort_controllers[url];
                params.signal = abort_controller.signal;
                return fetch(url, params).then(response => {
                    if (response.ok) {
                        urls.filter(other => other != url).map(other => abort_controllers[other].abort());
                        return response;
                    }
                    throw new CustomError(response.statusText, response);
                }).catch(error => {
                    return Promise.reject(error);
                })
            });

            return Promise.any(requests);
        }

        /// Rendering

        let progress_update_period = null;
        let query_sequence_num = 0;

        /// The last image drawn for each tile position, kept so that when the query or time
        /// window changes we can keep showing the previous image until the new one is loaded
        /// (instead of blinking to blank). Keyed by table + tile coordinates.
        let last_tile_image = {};

        function drawTileBuffer(tile, buf) {
            const ctx = tile.getContext('2d');
            const image = ctx.createImageData(1024, 1024, {colorSpace: 'display-p3'});
            image.data.set(new Uint8ClampedArray(buf));
            ctx.putImageData(image, 0, 0, 0, 0, 1024, 1024);
        }

        /// Surface a failed tile query to the user, unless it is an expected
        /// cancellation caused by a newer request superseding an in-flight one.
        async function reportTileError(error) {
            let text;
            if (error.errors) {
                text = await error.errors[0].payload.text();
            } else {
                console.log(error);
                text = error.toString();
            }
            if (!text.includes('QUERY_WAS_CANCELLED') &&
                !text.includes('QUERY_WITH_SAME_ID_IS_ALREADY_RUNNING')) {
                showError(text);
            }
        }

        /// Fetch the raw 1024x1024 RGBA buffer for one tile from ClickHouse, using the
        /// shared per-query tile cache. Throws on error; the caller decides how to
        /// surface it. Shared by the 2D (Leaflet) and 3D (Cesium) rendering paths.
        async function fetchTileBuffer(level, coords, sql) {
            const key = `${sipHash128(sql)}-${coords.z}-${coords.x}-${coords.y}`;

            if (!config.disable_cache) {
                if (!cached_tiles[key]) cached_tiles[key] = [];
                const cached = cached_tiles[key][level.priority];
                if (cached) return cached;
            }

            ++query_sequence_num;
            const query_id = `${uuid}-${query_sequence_num}-${level.table}-${coords.z - 2}-${coords.x}-${coords.y}`;
            const hosts = getHosts(key);
            const url = host => `${host}/?user=website&default_format=RowBinary` +
                (config.disable_cache ? '&use_query_cache=0' : '') +
                `&query_id=${query_id}&replace_running_query=1` +
                `&param_table=${level.table}&param_sampling=${level.sample}` +
                `&param_z=${coords.z - 2}&param_x=${coords.x}&param_y=${coords.y}`;

            progress_update_period = 1;

            const response = await fetchAny(hosts.map(host => url(host)), { method: 'POST', body: sql });
            const buf = await response.arrayBuffer();
            if (!config.disable_cache) {
                if (!cached_tiles[key]) cached_tiles[key] = [];
                cached_tiles[key][level.priority] = buf;
            }
            return buf;
        }

        async function render(level, coords, tile) {
            /// Each render of a given tile element bumps a token; a slower, superseded
            /// request must not overwrite the tile drawn by a newer one.
            const token = tile._renderToken = (tile._renderToken || 0) + 1;

            const sql = applyTimeWindow(query_elem.value);
            const coord_key = `${level.table}-${coords.z}-${coords.x}-${coords.y}`;

            let buf;
            try {
                buf = await fetchTileBuffer(level, coords, sql);
            } catch (error) {
                reportTileError(error);
                return;
            }

            /// A newer render for this tile has started; don't overwrite it with stale data.
            if (tile._renderToken !== token) return;

            drawTileBuffer(tile, buf);
            last_tile_image[coord_key] = buf;

            hideError();
        }

        L.GridLayer.ClickHouse = L.GridLayer.extend({
            createTile: function(coords, done) {
                let tile = L.DomUtil.create('canvas', 'leaflet-tile');
                tile.width = 1024;
                tile.height = 1024;
                /// Keep the previous image visible (no blink) until the new one arrives.
                const level = this.options.level;
                const previous = last_tile_image[`${level.table}-${coords.z}-${coords.x}-${coords.y}`];
                if (previous) drawTileBuffer(tile, previous);
                render(level, coords, tile).then(err => done(err, tile));
                return tile;
            },

            /// Re-render the tiles that are already on screen in place, without removing
            /// them. render() only overwrites each canvas once its new data arrives, so the
            /// current image stays put until then — no blank, and no drop to a coarser layer.
            refreshTiles: function() {
                for (const k in this._tiles) {
                    const t = this._tiles[k];
                    if (t && t.el && t.current) render(this.options.level, t.coords, t.el);
                }
            }
        });

        /// Special layer made of photos.
        async function getTopPhoto(coords) {
            /// This is fairly dirty.
            let condition = /WHERE(.+)GROUP BY/is.exec(query_elem.value)[1];
            const time_cond = getTimeCondition();
            if (time_cond) condition = `(${condition}) AND ${time_cond}`;

            const sql = `WITH
                bitShiftLeft(1::UInt64, 32 - {z:UInt8}) AS tile_size,

                tile_size * {x:UInt32} AS tile_x_begin,
                tile_size * ({x:UInt32} + 1) AS tile_x_end,

                tile_size * {y:UInt32} AS tile_y_begin,
                tile_size * ({y:UInt32} + 1) AS tile_y_end,

                mercator_x >= tile_x_begin AND mercator_x < tile_x_end
                AND mercator_y >= tile_y_begin AND mercator_y < tile_y_end AS in_tile

                SELECT url_sq AS src
                FROM flickr_mercator
                WHERE ${condition} AND has(sizes, 'k')
                ORDER BY count_faves DESC, count_views DESC
                LIMIT 1`;

            ++query_sequence_num;
            const query_id = `${uuid}-${query_sequence_num}-flickr_mercator_top-${coords.z + 2}-${coords.x}-${coords.y}`;
            const hosts = getHosts(`${coords.z}-${coords.x}-${coords.y}`);
            const url = host => `${host}/?user=website&default_format=JSON` +
                `&query_id=${query_id}&replace_running_query=1` +
                `&param_z=${coords.z + 2}&param_x=${coords.x}&param_y=${coords.y}`;

            progress_update_period = 1;

            try {
                const response = await fetchAny(hosts.map(host => url(host)), { method: 'POST', body: sql });
                const json = await response.json();
                if (json.data.length == 1) {
                    return json.data[0].src;
                }
            } catch (error) {
                let text;
                if (error.errors) {
                    const response = error.errors[0].payload;
                    text = await response.text();
                } else {
                    console.log(error);
                    text = error.toString();
                }
                if (!text.includes('QUERY_WAS_CANCELLED') &&
                    !text.includes('QUERY_WITH_SAME_ID_IS_ALREADY_RUNNING')) {
                    showError(text);
                }
            }
        }

        L.GridLayer.Photos = L.GridLayer.extend({
            createTile: function(coords, done) {
                let tile = L.DomUtil.create('img', 'leaflet-tile');
                tile.width = 64;
                tile.height = 64;
                getTopPhoto(coords).then(src => {
                    if (src) {
                        tile.src = src; tile.onload = () => done(null, tile);
                    } else {
                        done(null, tile);
                    }
                });
                return tile;
            }
        });

        let photos_layer_active = false;
        let photos_layer = new L.GridLayer.Photos({
            tileSize: 64,
            minZoom: 2,
            maxZoom: 19,
            minNativeZoom: 2,
            maxNativeZoom: 19,
        });

        /// Time slider
        ///
        /// For datasets that configure a `time` column, we show a histogram of activity by day
        /// below the examples, with two draggable handles that narrow the time window. When the
        /// window is narrowed, the corresponding time condition is added to the main query, the
        /// reports, and the photos overlay. The histogram itself reflects all the other filters
        /// of the main query (the built-in example filters and the user filter), but not the
        /// geographic tile predicate (which is per-tile) and not the time window itself.

        const MS_PER_DAY = 86400000;

        let timeslider_elem = document.getElementById('timeslider');
        let time_canvas = document.getElementById('timeslider-canvas');
        let time_label_elem = document.getElementById('timeslider-label');
        let time_reset_elem = document.getElementById('timeslider-reset');
        let time_hover_elem = document.getElementById('timeslider-hover');

        let time_data = [];            /// [{day, count}], day = integer days since epoch.
        let time_min_day = null;
        let time_max_day = null;
        let time_window = null;        /// {from, to} in day units, or null when the full range is selected.
        let time_hist_cond = null;     /// The last histogram condition, to avoid redundant reloads.
        let time_hist_seq = 0;
        let time_drag = null;          /// 'from' | 'to' | 'move' while dragging.
        let time_drag_anchor = 0;      /// Day under the cursor when a 'move' drag started.
        let time_drag_from0 = 0;       /// Window bounds when a 'move' drag started.
        let time_drag_to0 = 0;
        let time_hover_x = null;       /// Cursor x within the canvas (css px) while hovering, or null.

        function dayToDateStr(day) {
            return new Date(day * MS_PER_DAY).toISOString().slice(0, 10);
        }

        function dateStrToDay(s) {
            return Math.floor(Date.parse(s.length <= 10 ? s + 'T00:00:00Z' : s + 'Z') / MS_PER_DAY);
        }

        /// The time condition to inject into queries, or null when the window is not narrowed.
        function getTimeCondition() {
            if (!config.time || !time_window) return null;
            const col = config.time.column;
            const from = dayToDateStr(time_window.from);
            const to = dayToDateStr(time_window.to + 1); /// Exclusive upper bound, inclusive of the last day.
            return `${col} >= '${from}' AND ${col} < '${to}'`;
        }

        /// Inject the time window into a main tile query, right before its GROUP BY.
        function applyTimeWindow(sql) {
            const cond = getTimeCondition();
            if (!cond) return sql;
            return sql.replace(/(\bWHERE\b[\s\S]*?)(\bGROUP\s+BY\b)/i,
                `$1/* Time: */ AND ${cond}\n$2`);
        }

        /// The WHERE condition for the histogram: the main query's filters without the
        /// geographic tile predicate (which is replaced by a constant true).
        function getHistogramCondition() {
            const m = /\bWHERE\b([\s\S]+?)\bGROUP\s+BY\b/i.exec(query_elem.value);
            if (!m) return '1';
            return m[1].replace(/\bin_tile\b/, '1').trim();
        }

        function resetTimeSlider() {
            time_window = null;
            time_hist_cond = null;
            time_min_day = null;
            time_max_day = null;
            time_data = [];
            time_drag = null;
            time_reset_elem.style.display = 'none';
            time_label_elem.textContent = '';
        }

        function updateTimeSlider() {
            /// Showing/hiding the slider changes the map's height, so Leaflet must re-measure,
            /// otherwise it keeps the stale size and leaves part of the map unloaded.
            const want = config.time ? 'block' : 'none';
            if (timeslider_elem.style.display !== want) {
                timeslider_elem.style.display = want;
                if (typeof map !== 'undefined' && map) map.invalidateSize();
            }
            if (!config.time) return;

            /// Reload when either the query filters or the selected rectangle change.
            const sig = getHistogramSignature();
            if (sig !== time_hist_cond) {
                time_hist_cond = sig;
                loadHistogram();
            } else {
                drawHistogram();
            }
        }

        /// The geographic bounds of the current rectangular selection, or null.
        function getSelectionBounds() {
            if (selected_box.length != 2) return null;
            return {
                left: Math.min(selected_box[0].x, selected_box[1].x),
                right: Math.max(selected_box[0].x, selected_box[1].x),
                top: Math.min(selected_box[0].y, selected_box[1].y),
                bottom: Math.max(selected_box[0].y, selected_box[1].y),
            };
        }

        function getHistogramSignature() {
            const b = getSelectionBounds();
            return getHistogramCondition() + '|' + (b ? `${b.left},${b.right},${b.top},${b.bottom}` : '');
        }

        async function loadHistogram() {
            ++time_hist_seq;
            const seq = time_hist_seq;

            const col = config.time.column;
            const cond = getHistogramCondition();
            const exclude = config.time.exclude ? ` AND (${config.time.exclude})` : '';

            /// Read the cheapest (most-sampled) table. With a rectangular selection we return,
            /// per day, both the count inside the area and the total (without the selection),
            /// from the same sampled table, so the ratio between them is unbiased. Without a
            /// selection we just return the daily totals.
            const bounds = getSelectionBounds();
            const table = config.levels[0].table;
            const geoParams = bounds
                ? `&param_left=${bounds.left}&param_right=${bounds.right}&param_top=${bounds.top}&param_bottom=${bounds.bottom}`
                : '';

            const selectExpr = bounds
                ? `countIf(mercator_x >= {left:UInt32} AND mercator_x < {right:UInt32}` +
                  ` AND mercator_y >= {top:UInt32} AND mercator_y < {bottom:UInt32}) AS area, count() AS total`
                : `count() AS c`;

            const sql = `SELECT toInt32(toDate32(${col})) AS d, ${selectExpr}
                FROM {table:Identifier}
                WHERE (${cond})${exclude}
                GROUP BY d ORDER BY d`;

            const query_id = `${uuid}-timeslider-${seq}`;
            const hosts = getHosts('timeslider');
            const url = host => `${host}/?user=website&default_format=JSON` +
                (config.disable_cache ? '&use_query_cache=0' : '') +
                `&query_id=${query_id}&replace_running_query=1&param_table=${table}${geoParams}`;

            progress_update_period = 1;

            try {
                const response = await fetchAny(hosts.map(host => url(host)), { method: 'POST', body: sql });
                const json = await response.json();
                if (seq != time_hist_seq) return;
                processHistogram(json.data);
            } catch (error) {
                let text;
                if (error.errors) {
                    text = await error.errors[0].payload.text();
                } else {
                    text = error.toString();
                }
                if (!text.includes('QUERY_WAS_CANCELLED') &&
                    !text.includes('QUERY_WITH_SAME_ID_IS_ALREADY_RUNNING')) {
                    console.log('Time slider:', text);
                }
            }
        }

        /// How strongly to damp days with few total observations when showing the area's
        /// share of the totals: the smoothing constant is this fraction of the busiest day's
        /// total, added to each day's denominator so low-count days don't turn into noise.
        const TIME_SMOOTHING = 0.03;

        function processHistogram(data) {
            const rows = data
                .filter(r => r.d !== null)
                .map(r => r.total !== undefined
                    ? { day: Number(r.d), area: Number(r.area), total: Number(r.total) }
                    : { day: Number(r.d), count: Number(r.c) })
                .filter(r => Number.isFinite(r.day));

            if (rows.length && rows[0].total !== undefined) {
                /// Selection mode: plot the area's share of the totals, area / (total + k).
                let maxTotal = 0;
                for (const r of rows) if (r.total > maxTotal) maxTotal = r.total;
                const k = maxTotal * TIME_SMOOTHING;
                time_data = rows.map(r => ({ day: r.day, count: r.total + k > 0 ? r.area / (r.total + k) : 0 }));
            } else {
                time_data = rows;
            }

            if (!time_data.length) {
                time_min_day = null;
                time_max_day = null;
                drawHistogram();
                updateTimeLabel();
                return;
            }

            time_min_day = time_data[0].day;
            time_max_day = time_data[time_data.length - 1].day;

            /// Clamp a restored/existing window to the available range.
            if (time_window) {
                time_window.from = Math.max(time_min_day, Math.min(time_window.from, time_max_day));
                time_window.to = Math.max(time_window.from, Math.min(time_window.to, time_max_day));
                normalizeWindow();
            }

            time_reset_elem.style.display = time_window ? 'block' : 'none';
            drawHistogram();
            updateTimeLabel();
        }

        function dayToX(day, w) {
            const nDays = time_max_day - time_min_day + 1;
            return (day - time_min_day) / nDays * w;
        }

        function xToDay(clientX) {
            const rect = time_canvas.getBoundingClientRect();
            const nDays = time_max_day - time_min_day + 1;
            const frac = (clientX - rect.left) / rect.width;
            return time_min_day + Math.round(frac * nDays - 0.5);
        }

        function drawHistogram() {
            const dpr = window.devicePixelRatio || 1;
            const cssW = time_canvas.clientWidth;
            const cssH = time_canvas.clientHeight;
            if (!cssW || !cssH) return;

            time_canvas.width = Math.round(cssW * dpr);
            time_canvas.height = Math.round(cssH * dpr);

            const ctx = time_canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssW, cssH);
            if (time_min_day === null) return;

            const nDays = time_max_day - time_min_day + 1;
            const nBuckets = Math.max(1, Math.min(nDays, Math.floor(cssW)));
            const buckets = new Float64Array(nBuckets);
            for (const r of time_data) {
                const b = Math.min(nBuckets - 1, Math.floor((r.day - time_min_day) / nDays * nBuckets));
                buckets[b] += r.count;
            }

            let maxC = 0;
            for (const v of buckets) if (v > maxC) maxC = v;

            /// Rectangular (bar-chart-like) profile: gray bar bodies, brighter-gray vertical
            /// step edges between neighbours, and yellow tops. Buckets inside the selected
            /// window are drawn with brighter grays so the selection reads as "lit up".
            const bw = cssW / nBuckets;
            const xEdge = b => Math.round(b * bw);
            const yTop = b => Math.round(cssH - 1 - (maxC > 0 ? Math.pow(buckets[b] / maxC, 0.5) : 0) * (cssH - 2));

            const winFrom = time_window ? time_window.from : time_min_day;
            const winTo = time_window ? time_window.to : time_max_day;
            const xL = dayToX(winFrom, cssW);
            const xR = dayToX(winTo + 1, cssW);
            /// Only brighten when a window is actually narrowed; the default (full-range)
            /// view keeps its normal colors.
            const inside = x => time_window && x >= xL && x < xR;

            /// Bar bodies.
            for (let b = 0; b < nBuckets; ++b) {
                const x0 = xEdge(b), x1 = xEdge(b + 1), y = yTop(b);
                ctx.fillStyle = inside((x0 + x1) / 2) ? '#5f5f5f' : '#333';
                ctx.fillRect(x0, y, Math.max(1, x1 - x0), cssH - y);
            }

            /// Vertical step edges between neighbours.
            for (let b = 1; b < nBuckets; ++b) {
                const x = xEdge(b), y0 = yTop(b - 1), y1 = yTop(b);
                ctx.fillStyle = inside(x) ? '#adadad' : '#777';
                ctx.fillRect(x, Math.min(y0, y1), 1, Math.abs(y1 - y0) + 1);
            }

            /// Yellow tops, drawn last and spanning both boundary columns so the corner
            /// pixels belong to the top line rather than to the vertical edges.
            ctx.fillStyle = '#faff69';
            for (let b = 0; b < nBuckets; ++b) {
                const x0 = xEdge(b);
                ctx.fillRect(x0, yTop(b), xEdge(b + 1) - x0 + 1, 1);
            }

            /// Dim the region outside the selected window and draw the handles.
            ctx.fillStyle = 'rgba(16, 18, 19, 0.6)';
            if (xL > 0) ctx.fillRect(0, 0, xL, cssH);
            if (xR < cssW) ctx.fillRect(xR, 0, cssW - xR, cssH);

            ctx.fillStyle = '#faff69';
            ctx.fillRect(xL - 1, 0, 2, cssH);
            ctx.fillRect(xR - 1, 0, 2, cssH);
            const gh = Math.min(14, cssH);
            ctx.fillRect(xL - 3, (cssH - gh) / 2, 6, gh);
            ctx.fillRect(xR - 3, (cssH - gh) / 2, 6, gh);

            /// Hover cursor line.
            if (time_hover_x !== null) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
                ctx.fillRect(time_hover_x - 0.5, 0, 1, cssH);
            }
        }

        function updateTimeLabel() {
            if (time_min_day === null) {
                time_label_elem.textContent = '';
                return;
            }
            if (time_window) {
                time_label_elem.textContent = `${dayToDateStr(time_window.from)} — ${dayToDateStr(time_window.to)}`;
            } else {
                time_label_elem.textContent = `${dayToDateStr(time_min_day)} — ${dayToDateStr(time_max_day)}`;
            }
        }

        /// Collapse a full-range window back to "not narrowed".
        function normalizeWindow() {
            if (time_window &&
                time_window.from <= time_min_day &&
                time_window.to >= time_max_day) {
                time_window = null;
            }
        }

        function applyTimeSelection() {
            normalizeWindow();
            time_reset_elem.style.display = time_window ? 'block' : 'none';
            drawHistogram();
            updateTimeLabel();
            /// Refresh the map in place so the previous image stays until the new data for
            /// the changed time window arrives (no blink, no drop to a coarser layer).
            if (is3D) {
                cesiumRefresh();
            } else {
                layers.forEach(layer => { if (map.hasLayer(layer)) layer.refreshTiles(); });
                if (photos_layer_active) photos_layer.redraw();
            }
            if (selected_box.length == 2) showReport();
            updateHistory();
        }

        time_canvas.addEventListener('pointerdown', e => {
            if (time_min_day === null) return;

            const rect = time_canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const winFrom = time_window ? time_window.from : time_min_day;
            const winTo = time_window ? time_window.to : time_max_day;
            const xL = dayToX(winFrom, rect.width);
            const xR = dayToX(winTo + 1, rect.width);
            const dL = Math.abs(x - xL);
            const dR = Math.abs(x - xR);

            if (Math.min(dL, dR) <= 12) {
                /// Grab the nearer existing handle.
                time_drag = dL <= dR ? 'from' : 'to';
                time_canvas.style.cursor = 'ew-resize';
            } else if (time_window && x > xL && x < xR) {
                /// Inside the selected window (away from the handles): drag it as a whole.
                time_drag = 'move';
                time_drag_anchor = xToDay(e.clientX);
                time_drag_from0 = time_window.from;
                time_drag_to0 = time_window.to;
                time_canvas.style.cursor = 'grabbing';
            } else {
                /// Start a fresh selection from the clicked point.
                const day = Math.max(time_min_day, Math.min(time_max_day, xToDay(e.clientX)));
                time_window = { from: day, to: day };
                time_drag = 'to';
                time_canvas.style.cursor = 'ew-resize';
            }

            time_canvas.setPointerCapture(e.pointerId);
            drawHistogram();
            updateTimeLabel();
            e.preventDefault();
        });

        /// Show the vertical cursor line and the date under the pointer.
        function showTimeHover(clientX, rect) {
            const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
            time_hover_x = x;
            const day = Math.max(time_min_day, Math.min(time_max_day, xToDay(clientX)));
            time_hover_elem.textContent = dayToDateStr(day);
            time_hover_elem.style.display = 'block';
            /// The label is centered on the cursor; keep it fully within the chart so it
            /// sticks to the border near the edges instead of overflowing (which would add
            /// a horizontal scrollbar).
            const half = time_hover_elem.offsetWidth / 2;
            time_hover_elem.style.left = Math.max(half, Math.min(rect.width - half, x)) + 'px';
        }

        function hideTimeHover() {
            if (time_hover_x === null) return;
            time_hover_x = null;
            time_hover_elem.style.display = 'none';
            drawHistogram();
        }

        time_canvas.addEventListener('pointermove', e => {
            if (time_min_day === null) return;

            const rect = time_canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;

            showTimeHover(e.clientX, rect);

            if (!time_drag) {
                /// Not dragging: give the cursor a hint about what a drag here would do.
                const winFrom = time_window ? time_window.from : time_min_day;
                const winTo = time_window ? time_window.to : time_max_day;
                const xL = dayToX(winFrom, rect.width);
                const xR = dayToX(winTo + 1, rect.width);
                if (Math.min(Math.abs(x - xL), Math.abs(x - xR)) <= 12) {
                    time_canvas.style.cursor = 'ew-resize';
                } else if (time_window && x > xL && x < xR) {
                    time_canvas.style.cursor = 'grab';
                } else {
                    time_canvas.style.cursor = 'crosshair';
                }
                drawHistogram();
                return;
            }

            if (time_drag === 'move') {
                /// Shift the whole window, keeping its width, clamped to the range.
                const width = time_drag_to0 - time_drag_from0;
                const delta = xToDay(e.clientX) - time_drag_anchor;
                let from = time_drag_from0 + delta;
                let to = time_drag_to0 + delta;
                if (from < time_min_day) { from = time_min_day; to = from + width; }
                if (to > time_max_day) { to = time_max_day; from = to - width; }
                time_window.from = from;
                time_window.to = to;
            } else {
                let day = Math.max(time_min_day, Math.min(time_max_day, xToDay(e.clientX)));
                if (!time_window) time_window = { from: time_min_day, to: time_max_day };

                if (time_drag === 'from') time_window.from = day; else time_window.to = day;

                if (time_window.from > time_window.to) {
                    [time_window.from, time_window.to] = [time_window.to, time_window.from];
                    time_drag = time_drag === 'from' ? 'to' : 'from';
                }
            }

            time_reset_elem.style.display = 'block';
            drawHistogram();
            updateTimeLabel();
            e.preventDefault();
        });

        function timeDragEnd(e) {
            if (!time_drag) return;
            const was_move = time_drag === 'move';
            time_drag = null;
            /// A 'grabbing' hand should relax back to 'grab' once released over the window.
            time_canvas.style.cursor = was_move ? 'grab' : '';
            applyTimeSelection();
        }

        time_canvas.addEventListener('pointerup', timeDragEnd);
        time_canvas.addEventListener('pointercancel', timeDragEnd);

        time_canvas.addEventListener('pointerleave', () => {
            /// Keep the readout while an active drag continues outside the canvas.
            if (!time_drag) hideTimeHover();
        });

        time_reset_elem.addEventListener('click', () => {
            time_window = null;
            applyTimeSelection();
        });

        /// Double-clicking the chart also resets the window to the full range.
        time_canvas.addEventListener('dblclick', e => {
            time_drag = null;
            time_window = null;
            applyTimeSelection();
            e.preventDefault();
        });

        window.addEventListener('resize', () => {
            if (config && config.time) drawHistogram();
        });

        switchDataset('Planes');

        /// Restore from a saved link

        function latlngToMercator(latlng) {
            /// Normalize the longitude into [-180, 180): the map wraps around
            /// horizontally, so scrolling across the antimeridian yields
            /// out-of-range longitudes that would otherwise break the report query.
            const lng = ((latlng.lng + 180) % 360 + 360) % 360 - 180;
            return {
                x: Math.round(0xFFFFFFFF * ((lng + 180) / 360)),
                y: Math.round(0xFFFFFFFF * (1/2 - Math.log(Math.tan((latlng.lat + 90) / 360 * Math.PI)) / 2 / Math.PI)),
                lat: latlng.lat,
                lng: lng
            };
        }

        let initial_load = true;

        if (window.location.search) {
            const params = new URLSearchParams(window.location.search);
            const params_dataset = params.get('dataset');
            if (params_dataset && params_dataset != dataset) {
                switchDataset(params_dataset);
            }
            /// Restore the base map visibility (eye button) state.
            if (params.get('basemap') == '1') {
                setBasemapVisible(true);
            }
            /// Restore the time slider window (after the dataset switch, which resets it).
            const tfrom = params.get('tfrom');
            const tto = params.get('tto');
            if (tfrom && tto) {
                time_window = { from: dateStrToDay(tfrom), to: dateStrToDay(tto) };
                time_reset_elem.style.display = 'block';
            }
            const hash = params.get('query');
            if (hash) {
                loadQuery(hash).then(query => {
                    query_elem.value = query;
                    map.setView({lat: params.get('lat'), lng: params.get('lng')}, params.get('zoom'));
                    updateMap();

                    last_selected_example = null;
                    for (example of examples_elem.querySelectorAll('span')) {
                        example.classList.remove('selected');
                        if (query == queries[example.innerText]) {
                            example.classList.add('selected');
                            last_selected_example = example.innerText;
                        }
                    }
                });
            } else {
                map.setView({lat: params.get('lat'), lng: params.get('lng')}, params.get('zoom'));
                if (time_window) updateMap();
            }
            const box = params.get('box');
            if (box) {
                const arr = box.split(',');
                selected_box = [latlngToMercator({lat: +arr[0], lng: +arr[1]}), latlngToMercator({lat: +arr[2], lng: +arr[3]})];
                showReport();
            }
        } else {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    map.setView([position.coords.latitude, position.coords.longitude]);
                });
            }
        }

        /// Rectangle selection and reports

        let select_toggle = document.getElementById('select');
        let select_toggle_active = false;

        select_toggle.addEventListener('click', e => {
            select_toggle_active = !select_toggle_active;
            select_toggle.style.backgroundColor = select_toggle_active ? 'yellow' : '';

            if (select_toggle_active) {
                map.dragging.disable();
                map_elem.style.cursor = 'crosshair';
            } else {
                map.dragging.enable();
                map_elem.style.cursor = '';
                hideSelection();
                hideReport();
            }
        });

        let selecting = false;
        let selection_origin_point = {x: 0, y: 0};
        let selection = document.getElementById('selection');

        function showReport() {
            ++report_sequence_num;
            const current_report_sequence_num = report_sequence_num;

            /// Redraw the time chart for the selected area.
            updateTimeSlider();

            for (node of document.getElementById('report').childNodes) { node.textContent = '' };
            document.getElementById('report').style.display = 'block';
            document.documentElement.style.setProperty('--report-width', 'fit-content(20%)');

            const current_query = query_elem.value;

            /// This is fairly dirty.
            let condition = /WHERE(.+)GROUP BY/is.exec(current_query)[1];

            /// Apply the time slider window to the report queries as well.
            const time_cond = getTimeCondition();
            if (time_cond) condition = `(${condition}) AND ${time_cond}`;

            async function calculateReport(sql, field) {
                const query_id = `${uuid}-${field}-${current_report_sequence_num}`;
                const hosts = getHosts([field, selected_box, sql]);
                const url = host => `${host}/?user=website&default_format=JSON&query_id=${query_id}` +
                    `&param_table=${levels[levels.length - 1].table}` +
                    `&param_left=${Math.min(selected_box[0].x, selected_box[1].x)}` +
                    `&param_right=${Math.max(selected_box[0].x, selected_box[1].x)}` +
                    `&param_top=${Math.min(selected_box[0].y, selected_box[1].y)}` +
                    `&param_bottom=${Math.max(selected_box[0].y, selected_box[1].y)}`;

                progress_update_period = 1;
                const response = await fetchAny(hosts.map(host => url(host)), { method: 'POST', body: sql });

                if (!response.ok) {
                    const text = await response.text();
                    if (!text.includes('QUERY_WAS_CANCELLED') && !text.includes('QUERY_WITH_SAME_ID_IS_ALREADY_RUNNING')) {
                        showError(text);
                    }
                    return;
                }

                const json = await response.json();
                return json;
            }

            async function findPicture(name) {
                const wiki_api_url = 'https://en.wikipedia.org/w/api.php';

                const search_url = wiki_api_url + '?' + new URLSearchParams({
                    action: 'query',
                    list: 'search',
                    srsearch: name,
                    format: 'json',
                    origin: '*'
                });

                const response = await fetch(search_url);
                const search_data = await response.json();

                if (search_data.query && search_data.query.search && search_data.query.search.length > 0) {
                    const title = search_data.query.search[0].title;

                    const page_url = wiki_api_url + '?' + new URLSearchParams({
                        action: 'query',
                        titles: title,
                        prop: 'pageimages',
                        format: 'json',
                        origin: '*'
                    });

                    const response = await fetch(page_url);
                    const pages_data = await response.json();

                    const pages = pages_data.query.pages;
                    const page_id = Object.keys(pages)[0];
                    if (pages[page_id].thumbnail) {

                        const image_info_url = wiki_api_url + '?' + new URLSearchParams({
                            action: 'query',
                            titles: 'File:' + pages[page_id].pageimage,
                            prop: 'imageinfo',
                            iiprop: 'extmetadata',
                            format: 'json',
                            origin: '*'
                        });

                        const image_info_response = await fetch(image_info_url);
                        const image_info_data = await image_info_response.json();

                        const metadata = Object.values(image_info_data.query.pages)[0].imageinfo[0].extmetadata;
                        const attribution = `${metadata.LicenseShortName.value}, ${metadata.Artist.value}`;

                        return {src: pages[page_id].thumbnail.source.replace(/\/\d+px/, '/500px'), attr: attribution};
                    }
                }
            }

            /// Monotonically increasing token identifying the most recent hover.
            /// Async picture lookups compare against it so a late-resolving request
            /// for a previously hovered item cannot overwrite the current picture.
            let picture_hover_seq = 0;

            let cached_pictures = {};
            async function findPictureCached(name) {
                if (cached_pictures[name]) return cached_pictures[name];
                const result = await findPicture(name);
                cached_pictures[name] = result;
                return result;
            }

            function createList(condition, report) {
                calculateReport(report.query(condition), report.field).then(json => {
                    if (current_report_sequence_num != report_sequence_num) return;

                    let elem = document.getElementById(report.id);
                    clearContainer(elem);
                    elem.appendChild(document.createTextNode(report.title));
                    for (const [idx, row] of json.data.entries()) {
                        if (idx) {
                            let comma = document.createTextNode(report.separator);
                            elem.appendChild(comma);
                        }

                        if (report.html) {
                            let item = document.createElement('span');
                            item.innerHTML = report.html(row);
                            elem.appendChild(item);
                        } else {
                            let link = document.createElement('a');
                            link.textContent = report.content(row);

                            link.addEventListener('click', e => {
                                let sql_value = "'" + row[report.field].replace('\\', '\\\\').replace('\'', '\\\'') + "'";
                                let condition = report.filter_expr ? report.filter_expr(sql_value) : `${report.field} = ${sql_value}`;
                                let changed_query = current_query.replace(
                                    /(WHERE.+?)(\/\* Filter: \*\/ AND .+)?(GROUP BY)/is,
                                    '$1' + '/* Filter: */ AND ' + condition + '\n$3');

                                setQuery(changed_query);
                            });

                            /// Pictures from Wikipedia
                            if (report.wiki_field) {
                                link.addEventListener('mouseover', e => {
                                    const seq = ++picture_hover_seq;
                                    findPictureCached(row[report.wiki_field]).then(data => {
                                        /// Ignore results that arrive after the cursor moved elsewhere.
                                        if (seq !== picture_hover_seq) return;
                                        if (data) {
                                            let picture = document.getElementById('picture');
                                            picture.style.display = 'block';
                                            picture.firstChild.src = data.src;
                                            let copyright = document.getElementById('picture-copyright');
                                            copyright.innerHTML = data.attr;
                                            /// Sometimes there are tables, paragraphs, etc. Strip them.
                                            copyright.innerHTML = copyright.innerText;
                                        }
                                    });
                                });
                                link.addEventListener('mouseout', e => {
                                    /// Invalidate any in-flight lookup for this item.
                                    ++picture_hover_seq;
                                    let picture = document.getElementById('picture');
                                    picture.style.display = 'none';
                                    picture.firstChild.src = '';
                                });
                            }

                            elem.appendChild(link);
                        }
                    }
                    if (json.data.length >= 100) elem.appendChild(document.createTextNode('…'));
                });
            }

            calculateReport(config.report_total.query(condition), "total").then(json => {
                document.getElementById('report_total').textContent = config.report_total.content(json);
            });

            config.reports.forEach(report => {
                createList(condition, report);
            });
        }

        function hideReport() {
            selected_box = [];
            document.getElementById('report').style.display = 'none';
            document.documentElement.style.setProperty('--report-width', '0%');
            let picture = document.getElementById('picture');
            picture.style.display = 'none';
            picture.firstChild.src = '';
            /// Selection cleared — restore the whole-dataset time chart.
            updateTimeSlider();
        }

        function hideSelection() {
            selection.style.display = 'none';
            hideReport();
        }

        map.on('contextmenu', e => {
            return false;
        });

        function selectStart(e) {
            /// Box selection reads Leaflet coordinates, which are meaningless while the
            /// Cesium globe is shown. Disabled in 3D until selection is wired to Cesium.
            if (is3D) return;
            if (e.button !== 2 && !select_toggle_active) return;

            const rect = map_elem.getBoundingClientRect();
            const x = e.clientX - rect.x;
            const y = e.clientY - rect.y;

            selection_origin_point.x = Math.round(x);
            selection_origin_point.y = Math.round(y);

            selected_box[0] = latlngToMercator(map.containerPointToLatLng([x, y]));

            selection.style.display = 'block';
            selection.style.left = selection_origin_point.x + 'px';
            selection.style.top = selection_origin_point.y + 'px';
            selection.style.width = 0;
            selection.style.height = 0;
            selecting = true;

            e.preventDefault();
        }

        map_elem.addEventListener('pointerdown', selectStart);
        /// https://www.redblobgames.com/making-of/draggable/
        map_elem.addEventListener('touchstart', e => e.preventDefault());

        function selectMove(e) {
            /// In 3D the Cesium globe covers the (hidden) Leaflet map, so pointer moves
            /// over the globe would feed garbage Leaflet coordinates into the usage
            /// stats and box selection. Neither is wired for the globe yet — skip them.
            if (is3D) return;

            const rect = map_elem.getBoundingClientRect();
            const x = e.clientX - rect.x;
            const y = e.clientY - rect.y;
            const box = latlngToMercator(map.containerPointToLatLng([x, y]));
            addStats(box.x, box.y, map.getZoom());

            if (!selecting) return;

            if (x >= selection_origin_point.x) {
                selection.style.width = Math.round(x - selection_origin_point.x) + 'px';
            } else {
                selection.style.left = Math.round(x) + 'px';
                selection.style.width = Math.round(selection_origin_point.x - x) + 'px';
            }

            if (y >= selection_origin_point.y) {
                selection.style.height = Math.round(y - selection_origin_point.y) + 'px';
            } else {
                selection.style.top = Math.round(y) + 'px';
                selection.style.height = Math.round(selection_origin_point.y - y) + 'px';
            }

            e.preventDefault();
        };

        map_elem.addEventListener('pointermove', selectMove);

        function selectStop(e) {
            if ((e.button !== 2 && !select_toggle_active) || !selecting) return;
            selecting = false;

            const rect = map_elem.getBoundingClientRect();
            const x = e.clientX - rect.x;
            const y = e.clientY - rect.y;

            if (selection_origin_point.x == Math.round(x) &&
                selection_origin_point.y == Math.round(y)) {
                hideSelection();
            } else {
                selected_box[1] = latlngToMercator(map.containerPointToLatLng([x, y]));
                showReport();
                updateHistory();
            }

            e.preventDefault();
        };

        map_elem.addEventListener('pointerup', selectStop);
        map_elem.addEventListener('pointercancel', selectStop);

        /// Progress bar

        const progress_min_interval = 100;
        let progress_update_counter = 0;
        let previous_progress_update = 0;

        async function getStats() {
            ++progress_update_counter;
            if (!progress_update_period || (progress_update_counter - previous_progress_update) < progress_update_period) {
                setTimeout(getStats, progress_min_interval);
                return;
            }

            const sql = `SELECT
                    sum(read_rows) AS r,
                    sum(total_rows_approx) AS t,
                    sum(read_bytes) AS b,
                    r / max(elapsed) AS rps,
                    b / max(elapsed) AS bps,
                    formatReadableQuantity(r) AS formatted_rows,
                    formatReadableSize(b) AS formatted_bytes,
                    formatReadableQuantity(rps) AS formatted_rps,
                    formatReadableSize(bps) AS formatted_bps
                FROM clusterAllReplicas(default, system.processes)
                WHERE user = 'website' AND startsWith(query_id, {uuid:String})`;

            const hosts = getHosts(uuid);
            const url = host => `${host}/?user=website_progress&default_format=JSON&skip_unavailable_shards=1&param_uuid=${uuid}`;

            let responses = await Promise.all(hosts.map(host => fetch(url(host), { method: 'POST', body: sql })));
            let datas = await Promise.all(responses.map(response => response.json()));

            /// Which of the hosts are processing our queries?
            const stat = datas.map(d => d.data[0]).filter(d => d.t && d.t > 0).sort((a, b) => b.bps - a.bps)[0];

            if (stat) {
                document.documentElement.style.setProperty('--progress', (100 * stat.r / stat.t) + '%');

                let text = '';
                if (stat.r > 0) text += `Processed ${stat.formatted_rows} rows, ${stat.formatted_bytes}`;
                if (stat.rps > 100e6) text += ` (${stat.formatted_rps}/sec, ${stat.formatted_bps}/sec)`;

                document.getElementById('stats').textContent = text;
                progress_update_period = 1;
            } else {
                document.documentElement.style.setProperty('--progress', '0');
                progress_update_period *= 2;
            }

            previous_progress_update = progress_update_counter;
            setTimeout(getStats, progress_min_interval);
        }

        setTimeout(getStats, progress_min_interval);

        /// Saved queries

        function sipHash128(text) {
            const m = (new TextEncoder).encode(text);

            function rotl(v, offset, bits) {
                v[offset] = (v[offset] << bits) | (v[offset] >> (64n - bits));
            }

            function compress(v) {
                v[0] += v[1];
                v[2] += v[3];
                rotl(v, 1, 13n);
                rotl(v, 3, 16n);
                v[1] ^= v[0];
                v[3] ^= v[2];
                rotl(v, 0, 32n);
                v[2] += v[1];
                v[0] += v[3];
                rotl(v, 1, 17n);
                rotl(v, 3, 21n);
                v[1] ^= v[2];
                v[3] ^= v[0];
                rotl(v, 2, 32n);
            }

            const view = new DataView(m.buffer);
            let buf = new Uint8Array(new ArrayBuffer(8));
            let v = new BigUint64Array([0x736f6d6570736575n, 0x646f72616e646f6dn, 0x6c7967656e657261n, 0x7465646279746573n]);

            let offset = 0;
            for (; offset < m.length - 7; offset += 8) {
                let word = view.getBigUint64(offset, true);
                v[3] ^= word;
                compress(v);
                compress(v);
                v[0] ^= word;
            }

            buf.set(m.slice(offset));
            buf.fill(0, m.length - offset, 7);
            buf[7] = m.length;

            let word = new DataView(buf.buffer).getBigUint64(0, true);

            v[3] ^= word;
            compress(v);
            compress(v);
            v[0] ^= word;
            v[2] ^= 0xFFn;
            compress(v);
            compress(v);
            compress(v);
            compress(v);

            return ('00000000000000000000000000000000' + ((v[0] ^ v[1]) + ((v[2] ^ v[3]) << 64n)).toString(16)).substr(-32).
                match(/../g).reverse().join('');
        }

        async function saveQuery(text) {
            const sql = `INSERT INTO saved_queries (text) FORMAT RawBLOB`;
            const hosts = getHosts(null);
            const url = host => `${host}/?user=website_saved_queries&query=${encodeURIComponent(sql)}`;
            const response = await Promise.all(hosts.map(host => fetch(url(host), { method: 'POST', body: text })));
        }

        async function loadQuery(hash) {
            const sql = `SELECT text FROM saved_queries WHERE hash = unhex({hash:String}) LIMIT 1`;
            const hosts = getHosts(null);
            const url = host => `${host}/?user=website_saved_queries&default_format=JSON&param_hash=${hash}`;
            const response = await fetchAny(hosts.map(host => url(host)), { method: 'POST', body: sql });
            const data = await response.json();
            return data.data[0].text;
        }

        /// Usage statistics

        let stats = [];
        let start_time = new Date;

        function addStats(x, y, z) {
            const time_offset_ms = (new Date) - start_time;
            stats.push([x, y, z, start_time.toISOString(), time_offset_ms, uuid]);
        }

        async function sendStats() {
            if (stats.length == 0) return;

            const current_stats = stats;
            stats = [];

            const sql = `INSERT INTO stats (mercator_x, mercator_y, zoom, start_time, time_offset_ms, uuid) FORMAT JSONCompactEachRow`;
            const hosts = getHosts(null);
            const url = host => `${host}/?user=website_stats&query=${encodeURIComponent(sql)}`;
