            /// sticks to the border near the edges instead of overflowing (which would add
            /// a horizontal scrollbar).
            const half = time_hover_elem.offsetWidth / 2;
            time_hover_elem.style.left = Math.max(half, Math.min(rect.width - half, x)) + 'px';
        }

        function hideTimeHover() {
            if (time_hover_x === null) return;
            time_hover_x = null;
            time_hover_elem.style.display = 'none';
            drawHistogram();
        }

        time_canvas.addEventListener('pointermove', e => {
            if (time_min_day === null) return;

            const rect = time_canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;

            showTimeHover(e.clientX, rect);

            if (!time_drag) {
                /// Not dragging: give the cursor a hint about what a drag here would do.
                const zone = timeZoneAt(x, rect.width);
                time_canvas.style.cursor =
                    zone === 'move' ? 'grab' : zone === 'new' ? 'crosshair' : 'ew-resize';
                drawHistogram();
                return;
            }

            if (time_drag === 'move') {
                /// Shift the whole window, keeping its width, clamped to the range.
                const width = time_drag_to0 - time_drag_from0;
                const delta = xToDay(e.clientX) - time_drag_anchor;
                let from = time_drag_from0 + delta;
                let to = time_drag_to0 + delta;
                if (from < time_min_day) { from = time_min_day; to = from + width; }
                if (to > time_max_day) { to = time_max_day; from = to - width; }
                time_window.from = from;
                time_window.to = to;
            } else {
                let day = Math.max(time_min_day, Math.min(time_max_day, xToDay(e.clientX)));
                if (!time_window) time_window = { from: time_min_day, to: time_max_day };

                if (time_drag === 'from') time_window.from = day; else time_window.to = day;

                if (time_window.from > time_window.to) {
                    [time_window.from, time_window.to] = [time_window.to, time_window.from];
                    time_drag = time_drag === 'from' ? 'to' : 'from';
                }
            }

            time_reset_elem.style.display = 'block';
            drawHistogram();
            updateTimeLabel();
            e.preventDefault();
        });

        function timeDragEnd(e) {
            if (!time_drag) return;
            const was_move = time_drag === 'move';
            time_drag = null;
            /// A 'grabbing' hand should relax back to 'grab' once released over the window.
            time_canvas.style.cursor = was_move ? 'grab' : '';
            applyTimeSelection();
        }

        time_canvas.addEventListener('pointerup', timeDragEnd);
        time_canvas.addEventListener('pointercancel', timeDragEnd);

        time_canvas.addEventListener('pointerleave', () => {
            /// Keep the readout while an active drag continues outside the canvas.
            if (!time_drag) hideTimeHover();
        });

        time_reset_elem.addEventListener('click', () => {
            time_window = null;
            applyTimeSelection();
        });

        /// Double-clicking the chart also resets the window to the full range.
        time_canvas.addEventListener('dblclick', e => {
            time_drag = null;
            time_window = null;
            applyTimeSelection();
            e.preventDefault();
        });

        window.addEventListener('resize', () => {
            if (config && config.time) drawHistogram();
        });

        switchDataset('Planes');

        /// Restore from a saved link

        function latlngToMercator(latlng) {
            /// Normalize the longitude into [-180, 180): the map wraps around
            /// horizontally, so scrolling across the antimeridian yields
            /// out-of-range longitudes that would otherwise break the report query.
            const lng = ((latlng.lng + 180) % 360 + 360) % 360 - 180;
            return {
                x: Math.round(0xFFFFFFFF * ((lng + 180) / 360)),
                y: Math.round(0xFFFFFFFF * (1/2 - Math.log(Math.tan((latlng.lat + 90) / 360 * Math.PI)) / 2 / Math.PI)),
                lat: latlng.lat,
                lng: lng
            };
        }

        let initial_load = true;

        if (window.location.search) {
            const params = new URLSearchParams(window.location.search);
            const params_dataset = params.get('dataset');
            if (params_dataset && params_dataset != dataset) {
                switchDataset(params_dataset);
            }
            /// Restore the base map visibility (eye button) state.
            if (params.get('basemap') == '1') {
                setBasemapVisible(true);
            }
            /// Restore the time slider window (after the dataset switch, which resets it).
            const tfrom = params.get('tfrom');
            const tto = params.get('tto');
            if (tfrom && tto) {
                time_window = { from: dateStrToDay(tfrom), to: dateStrToDay(tto) };
                time_reset_elem.style.display = 'block';
            }
            const hash = params.get('query');
            if (hash) {
                loadQuery(hash).then(query => {
                    query_elem.value = query;
                    /// Before updateMap, which displays the active filter and for that needs to
                    /// know which example the query was filtered from.
                    selectExampleForQuery(query);
                    map.setView({lat: params.get('lat'), lng: params.get('lng')}, params.get('zoom'));
                    updateMap();
                });
            } else {
                map.setView({lat: params.get('lat'), lng: params.get('lng')}, params.get('zoom'));
                if (time_window) updateMap();
            }
            const box = params.get('box');
            if (box) {
                const arr = box.split(',');
                selected_box = [latlngToMercator({lat: +arr[0], lng: +arr[1]}), latlngToMercator({lat: +arr[2], lng: +arr[3]})];
                showReport();
            }
        } else {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    map.setView([position.coords.latitude, position.coords.longitude]);
                });
            }
        }

        /// Rectangle selection and reports

        let select_toggle = document.getElementById('select');
        let select_toggle_active = false;

        select_toggle.addEventListener('click', e => {
            select_toggle_active = !select_toggle_active;
            select_toggle.style.backgroundColor = select_toggle_active ? 'yellow' : '';

            if (select_toggle_active) {
                map.dragging.disable();
                map_elem.style.cursor = 'crosshair';
            } else {
                map.dragging.enable();
                map_elem.style.cursor = '';
                hideSelection();
                hideReport();
            }
        });

        let selecting = false;
        let selection_origin_point = {x: 0, y: 0};
        let selection = document.getElementById('selection');

        function showReport() {
            ++report_sequence_num;
            const current_report_sequence_num = report_sequence_num;

            /// Redraw the time chart for the selected area.
            updateTimeSlider();

            for (node of document.getElementById('report').childNodes) { node.textContent = '' };
            document.getElementById('report').style.display = 'block';
            document.body.classList.add('report-open');
            /// A width the user dragged earlier survives closing and reopening the panel.
            applyReportWidth();
            /// Keep the globe's rectangle on the area this report is about.
            cesiumUpdateSelection();

            const current_query = query_elem.value;

            /// This is fairly dirty.
            let condition = /WHERE(.+)GROUP BY/is.exec(current_query)[1];

            /// Apply the time slider window to the report queries as well.
            const time_cond = getTimeCondition();
            if (time_cond) condition = `(${condition}) AND ${time_cond}`;

            /// Live progress/stats for the report. A report is several JSON queries running at
            /// once (the totals plus one list per category); JSONEachRowWithProgress streams a
            /// progress packet for each, which we aggregate into a single progress bar and a
            /// stats line. This makes it visible — at conferences especially — that ClickHouse
            /// really is running these queries in real time (see issue #40).
            const report_progress_elem = document.getElementById('report_progress');
            report_progress_elem.textContent = '';
            report_progress_elem.style.setProperty('--report-progress', '0%');

            const report_query_progress = {};
            let report_queries_remaining = 1 + config.reports.length;

            function refreshReportProgress(finished) {
                if (current_report_sequence_num != report_sequence_num) return;

                let read_rows = 0, read_bytes = 0, total_rows = 0, elapsed_ns = 0;
                for (const key in report_query_progress) {
                    const p = report_query_progress[key];
                    read_rows += p.read_rows;
                    read_bytes += p.read_bytes;
                    total_rows += p.total_rows_to_read;
                    /// The queries run concurrently, so the report's wall time is the slowest one.
                    elapsed_ns = Math.max(elapsed_ns, p.elapsed_ns);
                }

                const pct = total_rows > 0 ? Math.min(100, 100 * read_rows / total_rows) : (finished ? 100 : 0);
                report_progress_elem.style.setProperty('--report-progress', pct + '%');

                let text;
                if (finished) {
                    text = `Elapsed: ${(elapsed_ns / 1e9).toFixed(3)} sec.`;
                    if (read_rows > 0) {
                        text += ` Processed ${read_rows.toLocaleString()} rows, ${formatReadableSize(read_bytes)}`;
                        if (elapsed_ns > 0) {
                            const rps = read_rows * 1e9 / elapsed_ns;
                            const bps = read_bytes * 1e9 / elapsed_ns;
                            text += ` (${Math.round(rps).toLocaleString()} rows/sec, ${formatReadableSize(bps)}/sec)`;
                        }
                    }
                } else {
                    text = `${pct.toFixed(1)}%`;
                    if (read_rows > 0) text += ` — ${read_rows.toLocaleString()} rows`;
                }
                report_progress_elem.textContent = text;
            }

            /// Coerce a progress field to a finite number. Progress packets omit fields in
            /// some cases — most notably `total_rows_to_read` is absent on query-cache hits
            /// (which re-selecting an overlapping area triggers) — and `+undefined` is NaN,
            /// which would otherwise poison the sums and render as "NaN%".
            const num = v => { const n = +v; return Number.isFinite(n) ? n : 0; };

            function reportQueryProgress(field, progress) {
                report_query_progress[field] = {
                    read_rows: num(progress.read_rows),
                    read_bytes: num(progress.read_bytes),
                    total_rows_to_read: num(progress.total_rows_to_read),
                    elapsed_ns: num(progress.elapsed_ns),
                };
                refreshReportProgress(false);
            }

            function reportQueryFinished() {
                if (current_report_sequence_num != report_sequence_num) return;
                if (--report_queries_remaining <= 0) refreshReportProgress(true);
            }

            async function calculateReport(sql, field) {
                const query_id = `${uuid}-${field}-${current_report_sequence_num}`;
                const hosts = getHosts([field, selected_box, sql]);
                const url = host => `${host}/?user=website&default_format=JSONEachRowWithProgress&query_id=${query_id}` +
                    `&param_table=${levels[levels.length - 1].table}` +
                    `&param_left=${Math.min(selected_box[0].x, selected_box[1].x)}` +
                    `&param_right=${Math.max(selected_box[0].x, selected_box[1].x)}` +
                    `&param_top=${Math.min(selected_box[0].y, selected_box[1].y)}` +
                    `&param_bottom=${Math.max(selected_box[0].y, selected_box[1].y)}`;

                progress_update_period = 1;

                try {
                    return await fetchJSONEachRowWithProgress(
                        hosts.map(host => url(host)),
                        { method: 'POST', body: sql },
                        progress => reportQueryProgress(field, progress));
                } catch (error) {
                    let text;
                    if (error && error.errors) {
                        try { text = await error.errors[0].payload.text(); } catch (e) { text = error.toString(); }
                    } else {
                        text = error && error.message ? error.message : String(error);
                    }
                    if (!text.includes('QUERY_WAS_CANCELLED') && !text.includes('QUERY_WITH_SAME_ID_IS_ALREADY_RUNNING')) {
                        showError(text);
                    }
                    return undefined;
                } finally {
                    reportQueryFinished();
                }
            }

            /// Wikipedia metadata is arbitrary HTML written by anyone, so it cannot be trusted.
            /// Parse it into an inert document (no scripts, no loaded resources, not attached to
            /// the page) and keep only the text: sometimes there are tables, paragraphs, etc.
            function htmlToText(html) {
                const doc = new DOMParser().parseFromString(html, 'text/html');
                for (const elem of doc.body.querySelectorAll('script, style')) elem.remove();
                return doc.body.textContent.replace(/\s+/g, ' ').trim();
            }

            async function findPicture(name) {
                const wiki_api_url = 'https://en.wikipedia.org/w/api.php';

                const search_url = wiki_api_url + '?' + new URLSearchParams({
                    action: 'query',
                    list: 'search',
                    srsearch: name,
                    format: 'json',
                    origin: '*'
                });

                const response = await fetch(search_url);
                const search_data = await response.json();

                if (search_data.query && search_data.query.search && search_data.query.search.length > 0) {
                    const title = search_data.query.search[0].title;

                    const page_url = wiki_api_url + '?' + new URLSearchParams({
                        action: 'query',
                        titles: title,
                        prop: 'pageimages',
                        format: 'json',
                        origin: '*'
                    });

                    const response = await fetch(page_url);
                    const pages_data = await response.json();

                    const pages = pages_data.query.pages;
                    const page_id = Object.keys(pages)[0];
                    if (pages[page_id].thumbnail) {

                        const image_info_url = wiki_api_url + '?' + new URLSearchParams({
                            action: 'query',
                            titles: 'File:' + pages[page_id].pageimage,
                            prop: 'imageinfo',
                            iiprop: 'extmetadata',
                            format: 'json',
                            origin: '*'
                        });

                        const image_info_response = await fetch(image_info_url);
                        const image_info_data = await image_info_response.json();

                        const metadata = Object.values(image_info_data.query.pages)[0].imageinfo[0].extmetadata;
                        const attribution = htmlToText(`${metadata.LicenseShortName.value}, ${metadata.Artist.value}`);

                        return {src: pages[page_id].thumbnail.source.replace(/\/\d+px/, '/500px'), attr: attribution};
                    }
                }
            }

            /// Monotonically increasing token identifying the most recent hover.
            /// Async picture lookups compare against it so a late-resolving request
            /// for a previously hovered item cannot overwrite the current picture.
            let picture_hover_seq = 0;

            let cached_pictures = {};
            async function findPictureCached(name) {
                if (cached_pictures[name]) return cached_pictures[name];
                const result = await findPicture(name);
                cached_pictures[name] = result;
                return result;
            }

            function createList(condition, report) {
                calculateReport(report.query(condition), report.field).then(json => {
                    if (!json || current_report_sequence_num != report_sequence_num) return;

                    let elem = document.getElementById(report.id);
                    clearContainer(elem);
                    elem.appendChild(document.createTextNode(report.title));
                    for (const [idx, row] of json.data.entries()) {
                        if (idx) {
                            let comma = document.createTextNode(report.separator);
                            elem.appendChild(comma);
                        }

                        if (report.html) {
                            let item = document.createElement('span');
                            item.innerHTML = report.html(row);
                            elem.appendChild(item);
                        } else {
                            let link = document.createElement('a');
                            link.textContent = report.content(row);

                            link.addEventListener('click', e => {
                                let sql_value = "'" + row[report.field].replace('\\', '\\\\').replace('\'', '\\\'') + "'";
                                let condition = report.filter_expr ? report.filter_expr(sql_value) : `${report.field} = ${sql_value}`;
                                let changed_query = current_query.replace(
                                    /(WHERE.+?)(\/\* Filter: \*\/ AND .+)?(GROUP BY)/is,
                                    '$1' + '/* Filter: */ AND ' + condition + '\n$3');

                                setQuery(changed_query);
                            });

                            /// Pictures from Wikipedia
                            if (report.wiki_field) {
                                link.addEventListener('mouseover', e => {
                                    const seq = ++picture_hover_seq;
                                    findPictureCached(row[report.wiki_field]).then(data => {
                                        /// Ignore results that arrive after the cursor moved elsewhere.
                                        if (seq !== picture_hover_seq) return;
                                        if (data) {
                                            let picture = document.getElementById('picture');
                                            picture.style.display = 'block';
                                            picture.firstChild.src = data.src;
                                            let copyright = document.getElementById('picture-copyright');
                                            copyright.textContent = data.attr;
                                        }
                                    });
                                });
                                link.addEventListener('mouseout', e => {
                                    /// Invalidate any in-flight lookup for this item.
                                    ++picture_hover_seq;
                                    let picture = document.getElementById('picture');
                                    picture.style.display = 'none';
                                    picture.firstChild.src = '';
                                });
                            }

                            elem.appendChild(link);
                        }
                    }
                    if (json.data.length >= 100) elem.appendChild(document.createTextNode('…'));
                });
            }

            calculateReport(config.report_total.query(condition), "total").then(json => {
                if (!json || current_report_sequence_num != report_sequence_num) return;
                document.getElementById('report_total').textContent = config.report_total.content(json);
            });

            config.reports.forEach(report => {
                createList(condition, report);
            });
        }

        function hideReport() {
            selected_box = [];
            /// The selection is gone, so take its rectangle off the globe too.
            cesiumUpdateSelection();
            document.getElementById('report').style.display = 'none';
            document.body.classList.remove('report-open');
            /// The column must really collapse: a leftover explicit track width would keep an
            /// empty gap on the right even with the panel itself hidden.
            document.body.style.gridTemplateColumns = '';
            let picture = document.getElementById('picture');
            picture.style.display = 'none';
            picture.firstChild.src = '';
            /// Selection cleared — restore the whole-dataset time chart.
            updateTimeSlider();
        }

        function hideSelection() {
            selection.style.display = 'none';
            hideReport();
        }

        map.on('contextmenu', e => {
            return false;
        });

        function selectStart(e) {
            /// Box selection reads Leaflet coordinates, which are meaningless while the
            /// Cesium globe is shown. In 3D the globe has its own right-drag selection, which
            /// picks the corners off the sphere instead (see setupCesiumSelection).
            if (is3D) return;
            if (e.button !== 2 && !select_toggle_active) return;

            const rect = map_elem.getBoundingClientRect();
            const x = e.clientX - rect.x;
            const y = e.clientY - rect.y;

            selection_origin_point.x = Math.round(x);
            selection_origin_point.y = Math.round(y);

            selected_box[0] = latlngToMercator(map.containerPointToLatLng([x, y]));

            selection.style.display = 'block';
            selection.style.left = selection_origin_point.x + 'px';
            selection.style.top = selection_origin_point.y + 'px';
            selection.style.width = 0;
            selection.style.height = 0;
            selecting = true;

            e.preventDefault();
        }

        map_elem.addEventListener('pointerdown', selectStart);
        /// https://www.redblobgames.com/making-of/draggable/
        map_elem.addEventListener('touchstart', e => e.preventDefault());

        function selectMove(e) {
            /// In 3D the Cesium globe covers the (hidden) Leaflet map, so pointer moves
            /// over the globe would feed garbage Leaflet coordinates into the usage
            /// stats and box selection. Neither is wired for the globe yet — skip them.
            if (is3D) return;

            const rect = map_elem.getBoundingClientRect();
            const x = e.clientX - rect.x;
            const y = e.clientY - rect.y;
            const box = latlngToMercator(map.containerPointToLatLng([x, y]));
            addStats(box.x, box.y, map.getZoom());

            if (!selecting) return;

            if (x >= selection_origin_point.x) {
                selection.style.width = Math.round(x - selection_origin_point.x) + 'px';
            } else {
                selection.style.left = Math.round(x) + 'px';
                selection.style.width = Math.round(selection_origin_point.x - x) + 'px';
            }

            if (y >= selection_origin_point.y) {
                selection.style.height = Math.round(y - selection_origin_point.y) + 'px';
            } else {
                selection.style.top = Math.round(y) + 'px';
                selection.style.height = Math.round(selection_origin_point.y - y) + 'px';
            }

            e.preventDefault();
        };

        map_elem.addEventListener('pointermove', selectMove);

        function selectStop(e) {
            if ((e.button !== 2 && !select_toggle_active) || !selecting) return;
            selecting = false;

            const rect = map_elem.getBoundingClientRect();
            const x = e.clientX - rect.x;
            const y = e.clientY - rect.y;

            if (selection_origin_point.x == Math.round(x) &&
                selection_origin_point.y == Math.round(y)) {
                hideSelection();
            } else {
                selected_box[1] = latlngToMercator(map.containerPointToLatLng([x, y]));
                showReport();
                updateHistory();
            }

            e.preventDefault();
        };

        map_elem.addEventListener('pointerup', selectStop);
        map_elem.addEventListener('pointercancel', selectStop);

        /// Progress bar

        const progress_min_interval = 100;
        let progress_update_counter = 0;
        let previous_progress_update = 0;

        async function getStats() {
            ++progress_update_counter;
            if (!progress_update_period || (progress_update_counter - previous_progress_update) < progress_update_period) {
                setTimeout(getStats, progress_min_interval);
                return;
            }

            const sql = `SELECT
                    sum(read_rows) AS r,
                    sum(total_rows_approx) AS t,
                    sum(read_bytes) AS b,
                    r / max(elapsed) AS rps,
                    b / max(elapsed) AS bps,
                    formatReadableQuantity(r) AS formatted_rows,
                    formatReadableSize(b) AS formatted_bytes,
                    formatReadableQuantity(rps) AS formatted_rps,
                    formatReadableSize(bps) AS formatted_bps
                FROM clusterAllReplicas(default, system.processes)
                WHERE user = 'website' AND startsWith(query_id, {uuid:String})`;

            const hosts = getHosts(uuid);
            const url = host => `${host}/?user=website_progress&default_format=JSON&skip_unavailable_shards=1&param_uuid=${uuid}`;

            let responses = await Promise.all(hosts.map(host => fetch(url(host), { method: 'POST', body: sql })));
            let datas = await Promise.all(responses.map(response => response.json()));

            /// Which of the hosts are processing our queries?
            const stat = datas.map(d => d.data[0]).filter(d => d.t && d.t > 0).sort((a, b) => b.bps - a.bps)[0];

            if (stat) {
                document.documentElement.style.setProperty('--progress', (100 * stat.r / stat.t) + '%');

                let text = '';
                if (stat.r > 0) text += `Processed ${stat.formatted_rows} rows, ${stat.formatted_bytes}`;
                if (stat.rps > 100e6) text += ` (${stat.formatted_rps}/sec, ${stat.formatted_bps}/sec)`;

                document.getElementById('stats').textContent = text;
                progress_update_period = 1;
            } else {
                document.documentElement.style.setProperty('--progress', '0');
                progress_update_period *= 2;
            }

            previous_progress_update = progress_update_counter;
            setTimeout(getStats, progress_min_interval);
        }

        setTimeout(getStats, progress_min_interval);

        /// Saved queries

        function sipHash128(text) {
            const m = (new TextEncoder).encode(text);

            function rotl(v, offset, bits) {
                v[offset] = (v[offset] << bits) | (v[offset] >> (64n - bits));
            }

            function compress(v) {
                v[0] += v[1];
                v[2] += v[3];
                rotl(v, 1, 13n);
                rotl(v, 3, 16n);
                v[1] ^= v[0];
                v[3] ^= v[2];
                rotl(v, 0, 32n);
                v[2] += v[1];
                v[0] += v[3];
                rotl(v, 1, 17n);
                rotl(v, 3, 21n);
                v[1] ^= v[2];
                v[3] ^= v[0];
                rotl(v, 2, 32n);
            }

            const view = new DataView(m.buffer);
            let buf = new Uint8Array(new ArrayBuffer(8));
            let v = new BigUint64Array([0x736f6d6570736575n, 0x646f72616e646f6dn, 0x6c7967656e657261n, 0x7465646279746573n]);

            let offset = 0;
            for (; offset < m.length - 7; offset += 8) {
                let word = view.getBigUint64(offset, true);
                v[3] ^= word;
                compress(v);
                compress(v);
                v[0] ^= word;
            }

            buf.set(m.slice(offset));
            buf.fill(0, m.length - offset, 7);
            buf[7] = m.length;

            let word = new DataView(buf.buffer).getBigUint64(0, true);

            v[3] ^= word;
            compress(v);
            compress(v);
            v[0] ^= word;
            v[2] ^= 0xFFn;
            compress(v);
            compress(v);
            compress(v);
            compress(v);

            return ('00000000000000000000000000000000' + ((v[0] ^ v[1]) + ((v[2] ^ v[3]) << 64n)).toString(16)).substr(-32).
                match(/../g).reverse().join('');
        }

        async function saveQuery(text) {
            const sql = `INSERT INTO saved_queries (text) FORMAT RawBLOB`;
            const hosts = getHosts(null);
            const url = host => `${host}/?user=website_saved_queries&query=${encodeURIComponent(sql)}`;
            const response = await Promise.all(hosts.map(host => fetch(url(host), { method: 'POST', body: text })));
        }

        async function loadQuery(hash) {
            const sql = `SELECT text FROM saved_queries WHERE hash = unhex({hash:String}) LIMIT 1`;
            const hosts = getHosts(null);
            const url = host => `${host}/?user=website_saved_queries&default_format=JSON&param_hash=${hash}`;
            const response = await fetchAny(hosts.map(host => url(host)), { method: 'POST', body: sql });
            const data = await response.json();
            return data.data[0].text;
        }

        /// Usage statistics

        let stats = [];
        let start_time = new Date;

        function addStats(x, y, z) {
            const time_offset_ms = (new Date) - start_time;
            stats.push([x, y, z, start_time.toISOString(), time_offset_ms, uuid]);
        }

        async function sendStats() {
            if (stats.length == 0) return;

            const current_stats = stats;
            stats = [];

            const sql = `INSERT INTO stats (mercator_x, mercator_y, zoom, start_time, time_offset_ms, uuid) FORMAT JSONCompactEachRow`;
            const hosts = getHosts(null);
            const url = host => `${host}/?user=website_stats&query=${encodeURIComponent(sql)}`;
            const response = await Promise.all(hosts.map(host => fetch(url(host), { method: 'POST', body: JSON.stringify(current_stats).slice(1, -1) })));
        }

        setInterval(sendStats, 1000);

        /// Layers visibility toggle

        function setBasemapVisible(visible) {
            if (visible) {
                base_layer.setOpacity(0.5);
                base_layer.bringToFront();
            } else {
                base_layer.setOpacity(0.1);
                base_layer.bringToBack();
            }
        }

        document.getElementById('layers').addEventListener('click', e => {
            setBasemapVisible(base_layer.options.opacity < 0.5);
            updateHistory();
        });

        /// History support

        function updateHistory() {
            const text = query_elem.value;
            saveQuery(text);
            const query_hash = sipHash128(text);

            const basemap_visible = base_layer.options.opacity >= 0.5;

            /// In 3D the user navigates the Cesium camera, not the (hidden) Leaflet map,
            /// so read the view from the camera. Zoom uses the same height↔zoom relation
            /// as the camera setup in initCesium, so shared links round-trip.
            let center, zoom;
            if (is3D && cesiumViewer) {
                const carto = cesiumViewer.camera.positionCartographic;
                center = { lat: Cesium.Math.toDegrees(carto.latitude), lng: Cesium.Math.toDegrees(carto.longitude) };
                zoom = +Math.log2(4e7 / Math.max(carto.height, 1)).toFixed(2);
            } else {
                center = map.getCenter();
                zoom = map.getZoom();
            }

            const state = {
                dataset: dataset,
                zoom: zoom,
                center: center,
                query: text,
                box: selected_box,
                time: time_window,
                basemap: basemap_visible,
            };

            let search = `?dataset=${dataset}&zoom=${state.zoom}&lat=${state.center.lat.toFixed(4)}&lng=${state.center.lng.toFixed(4)}&query=${query_hash}`;
            if (selected_box.length == 2) {
                search += `&box=${selected_box[0].lat.toFixed(4)},${selected_box[0].lng.toFixed(4)},${selected_box[1].lat.toFixed(4)},${selected_box[1].lng.toFixed(4)}`;
            }
            if (time_window) {
                search += `&tfrom=${dayToDateStr(time_window.from)}&tto=${dayToDateStr(time_window.to)}`;
            }
            if (basemap_visible) {
                search += `&basemap=1`;
            }
            if (is3D) {
                search += `&3d=1`;   /// Keep the 3D choice in the link across navigation.
            }
            if (tile_scale > 1) {
                /// Likewise for the resolution — this rewrite would otherwise drop it, and
                /// panning the map would silently undo the setting.
                search += `&res=${tile_scale}`;
            }
            history.replaceState(state, '', search);
        }

        window.onpopstate = function(event) {
            const state = event.state;
            if (!state) return;
            if (state.dataset && state.dataset != dataset) {
                switchDataset(state.dataset);
            }
            query_elem.value = state.query;
            selectExampleForQuery(state.query);
            time_window = state.time || null;
            time_reset_elem.style.display = time_window ? 'block' : 'none';
            setBasemapVisible(!!state.basemap);
            map.setView(state.center, state.zoom);
            updateMap();
            if (state.box.length == 2) {
                selected_box = state.box;
                showReport();
            }
        };

        map.on('movestart', e => {
            selection.style.display = 'none';
        });
        map.on('moveend', e => {
            if (!initial_load) {
                updateHistory();
            } else {
                initial_load = false;
            }

            /// The globe draws its own rectangle (see cesiumUpdateSelection). This flat one is
            /// placed with Leaflet's projection, which has nothing to do with what the camera
            /// is looking at, and it sits above the Cesium canvas — so in 3D it would show up
            /// as a second, misplaced selection floating over the globe.
            if (!is3D && selected_box && selected_box.length == 2) {
                const point0 = map.latLngToContainerPoint([selected_box[0].lat, selected_box[0].lng]);
                const point1 = map.latLngToContainerPoint([selected_box[1].lat, selected_box[1].lng]);

                selection.style.display = 'block';
                selection.style.left = point0.x + 'px';
                selection.style.top = point0.y + 'px';
                selection.style.width = (point1.x - point0.x) + 'px';
                selection.style.height = (point1.y - point0.y) + 'px';
            }
        });

        /// -------------------------------------------------------------------------
        /// Experimental 3D globe mode (CesiumJS), hidden behind ?3d=1.
        ///
        /// It reuses the exact same ClickHouse density tiles as the 2D view — served
        /// as a custom Cesium imagery layer — so every dataset, query and time filter
        /// keeps working. Draping the Mercator-computed tiles back onto a sphere also
        /// corrects the high-latitude density distortion of the flat map (issue #4):
        /// tiles that Mercator stretches near the poles get compressed again on the
        /// globe, restoring a faithful sense of density.
        ///
        /// Cesium is heavy, so it is loaded lazily only when the parameter is present;
        /// normal 2D visitors never download it.
        /// -------------------------------------------------------------------------

        /// Served from cdnjs (a single Cloudflare origin with CORS and no redirects).
        /// Cesium's own download CDN cross-origin-redirects the Web Worker scripts,
        /// which browsers refuse ("cross-origin redirects of the top-level worker").
        const CESIUM_VERSION = '1.118.0';
        const CESIUM_BASE = `https://cdnjs.cloudflare.com/ajax/libs/cesium/${CESIUM_VERSION}/`;

        let cesiumOsmLayer = null;
        let cesiumLevel = 2;   /// The single, uniform imagery level currently in use.
        let cesiumPhotosActive = false;     /// Photos overlay toggle state in 3D.
        let cesiumPhotoEntities = [];       /// Currently shown photo billboards.
        let cesiumPhotosTimer = null;       /// Debounce for photo refetches on camera move.

        /// Build an HTMLCanvasElement from a raw 1024x1024 RGBA tile buffer, matching
        /// drawTileBuffer (same display-p3 color space). Cesium accepts a canvas as a
        /// tile image directly.
        function bufToTileCanvas(buf) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            const image = ctx.createImageData(1024, 1024, {colorSpace: 'display-p3'});
            image.data.set(new Uint8ClampedArray(buf));
            ctx.putImageData(image, 0, 0);
            return canvas;
        }

        /// The finest sampling table worth loading at a given tile level — heavily
        /// sampled (cheap) tables suffice when zoomed out; full detail up close. The
        /// progressive load walks from the coarsest table up to this one.
        function cesiumMaxSamplingIndex(z) {
            const idx = z <= 3 ? 0 : z <= 6 ? 1 : levels.length - 1;
            return Math.min(idx, levels.length - 1);
        }

        /// A Cesium ImageryProvider backed by the ClickHouse density tiles for one
        /// sampling table. Cesium's WebMercatorTilingScheme uses one 1024px tile at
        /// level 0 and 2^L tiles at level L — exactly the tiling ClickHouse expects via
        /// param_z/x/y — so a Cesium level *is* ClickHouse's param_z. (tile_scale plays no
        /// part here: in 3D the level comes from the camera height, see cesiumTargetLevel.)
        function makeDensityImageryProvider(samplingLevel) {
            const tilingScheme = new Cesium.WebMercatorTilingScheme();
            /// Freeze the query for this provider instance; cesiumRefresh() creates a
            /// fresh instance whenever the query or time window changes.
            const sql = applyTimeWindow(query_elem.value);

            /// When a tile's query fails (a busy endpoint, an aborted request), ask
            /// Cesium to re-request it a few times before giving up. Otherwise the
            /// coarse parent tile stays on screen for good, looking low quality — the
            /// finer level never gets loaded.
            const errorEvent = new Cesium.Event();
            errorEvent.addEventListener(error => {
                if (error.timesRetried < 5) {
                    error.retry = true;
                } else if (error.error) {
                    reportTileError(error.error);
                }
            });

            return {
                tileWidth: 1024,
                tileHeight: 1024,
                /// Uniform level of detail across the whole globe: with minimum ==
                /// maximum, Cesium clamps every terrain tile to this one imagery level,
                /// so detail is consistent instead of finer near the camera and coarser
                /// toward the horizon. The level tracks the camera height — see
                /// cesiumTargetLevel / cesiumUpdateLevel.
                minimumLevel: cesiumLevel,
                maximumLevel: cesiumLevel,
                tilingScheme: tilingScheme,
                rectangle: tilingScheme.rectangle,
                errorEvent: errorEvent,
                credit: new Cesium.Credit(`© Alexey Milovidov, ClickHouse, Inc. (data: ${config.notice})`),
                hasAlphaChannel: true,
                proxy: undefined,
                tileDiscardPolicy: undefined,
                getTileCredits: function() { return undefined; },
                pickFeatures: function() { return undefined; },
                requestImage: async function(x, y, level, request) {
                    /// Throw on failure so Cesium's retry (errorEvent above) kicks in
                    /// instead of caching a blank tile.
                    const buf = await fetchTileBuffer(samplingLevel, { z: level, x: x, y: y }, sql);
                    hideError();
                    return bufToTileCanvas(buf);
                }
            };
        }

        /// Run `callback` once the globe's tile queue has done some work and then
        /// drained — i.e. the tiles requested just now have loaded. The `started` guard
        /// stops an already-idle queue from firing immediately; a timeout is a fallback
        /// so nothing waits forever.
        function cesiumWhenTilesLoaded(callback) {
            const globe = cesiumViewer.scene.globe;
            let started = false;
            const done = () => {
                globe.tileLoadProgressEvent.removeEventListener(onProgress);
                clearTimeout(fallback);
                callback();
            };
            const onProgress = queued => {
                if (queued > 0) started = true;
                else if (started) done();
            };
            globe.tileLoadProgressEvent.addEventListener(onProgress);
            const fallback = setTimeout(done, 5000);
        }

        /// Restart the density load. Like the 2D map, it loads iteratively: the coarsest
        /// (most heavily sampled, cheapest) table first for instant feedback, then each
        /// finer table in turn up to the detail the current zoom warrants. Each step is
        /// drawn on top and the previous one is kept underneath until the new tiles have
        /// loaded, so it refines in place without blinking. A generation counter cancels
        /// an in-flight sequence when the query, time window or zoom level changes.
        let cesiumLoadGen = 0;
        function cesiumRefresh() {
            if (!cesiumViewer) return;
            cesiumLoadSampling(++cesiumLoadGen, 0);
            /// A query or time-window change also changes which photos are on top.
            cesiumUpdatePhotos();
        }

        function cesiumLoadSampling(gen, idx) {
            if (!cesiumViewer || gen !== cesiumLoadGen || idx > cesiumMaxSamplingIndex(cesiumLevel)) return;

            const layers = cesiumViewer.imageryLayers;
            const samplingLevel = levels[idx];
            const previous = cesiumDensityLayer;

            const layer = new Cesium.ImageryLayer(makeDensityImageryProvider(samplingLevel), {
                /// Only drape the uniform-level density on terrain tiles that are at
                /// least this detailed. Otherwise a coarse (e.g. root) terrain tile,
                /// which spans a huge area, would pull in the entire complement of
                /// fine imagery tiles for its span — requesting the whole globe at once.
                minimumTerrainLevel: cesiumLevel,
            });
            layers.add(layer);   /// New sampling step sits on top of the previous one.
            /// The density tiles are data rasters, not photos — sample them without
            /// smoothing when magnified, so they stay crisp like the 2D map's
            /// image-rendering: pixelated instead of blurring between data points.
            layer.magnificationFilter = Cesium.TextureMagnificationFilter.NEAREST;
            cesiumDensityLayer = layer;

            /// Colour the progress bar by the sampling table being loaded, like the 2D
            /// map (whose Leaflet load events — which set these — never fire in 3D).
            document.documentElement.style.setProperty('--progress-background-color', `var(--progress-background-color${samplingLevel.priority})`);
            document.documentElement.style.setProperty('--progress-foreground-color', `var(--progress-foreground-color${samplingLevel.priority})`);

            cesiumWhenTilesLoaded(() => {
                /// Drop the now-covered previous step (a coarser sample or a stale layer
                /// from a superseded sequence).
                if (previous && layers.contains(previous)) layers.remove(previous, true);
                if (gen === cesiumLoadGen) {
                    cesiumLoadSampling(gen, idx + 1);   /// Refine to the next finer table.
                } else if (layers.contains(layer)) {
                    layers.remove(layer, true);         /// Superseded; discard this step.
                }
            });
        }

        /// The imagery level appropriate for the current camera height, so that one
        /// on-screen tile is roughly one tile's worth of the view. This single level is
        /// applied uniformly across the globe (see makeDensityImageryProvider).
        function cesiumTargetLevel(scene) {
            const worldMeters = 2 * Math.PI * 6378137;
            const height = Math.max(scene.camera.positionCartographic.height, 1);
            /// tile ground size at level L (1024px tiles) = worldMeters / 2^L; pick L so
            /// that size ≈ the view's ground span (∝ camera height, scaled by pixels).
            const level = Math.round(Math.log2(worldMeters * scene.canvas.height / (1024 * height)));
            return Math.max(0, Math.min(16, level));
        }

        /// Rebuild the density layer at a new uniform level when the camera has zoomed
        /// enough to warrant it. Panning at the same level does nothing.
        function cesiumUpdateLevel(scene) {
            const level = cesiumTargetLevel(scene);
            if (level !== cesiumLevel) {
                cesiumLevel = level;
                cesiumRefresh();
            }
        }

        /// Inverse of latlngToMercator: 32-bit Web-Mercator integers back to lon/lat.
        function mercatorToLatLng(x, y) {
            const lng = x / 0xFFFFFFFF * 360 - 180;
            const latRad = 2 * Math.atan(Math.exp((1 - 2 * y / 0xFFFFFFFF) * Math.PI)) - Math.PI / 2;
            return { lat: latRad * 180 / Math.PI, lng: lng };
        }

        /// Photos overlay for the globe: the Leaflet photo tiles can't be shown on the
        /// sphere, so instead we fetch the top photos in the current view and place them
        /// as fixed-size billboards at their real locations. Debounced on camera moves.
        function cesiumUpdatePhotos() {
            if (cesiumPhotosTimer) { clearTimeout(cesiumPhotosTimer); cesiumPhotosTimer = null; }

            function clearPhotos() {
                cesiumPhotoEntities.forEach(e => cesiumViewer.entities.remove(e));
                cesiumPhotoEntities = [];
            }

            if (!cesiumViewer || !cesiumPhotosActive) { clearPhotos(); return; }

            cesiumPhotosTimer = setTimeout(async () => {
                /// Visible lon/lat box → Mercator bounds for the query.
                const rect = cesiumViewer.camera.computeViewRectangle(cesiumViewer.scene.globe.ellipsoid)
                    || Cesium.Rectangle.MAX_VALUE;
                const nw = latlngToMercator({ lat: Cesium.Math.toDegrees(rect.north), lng: Cesium.Math.toDegrees(rect.west) });
                const se = latlngToMercator({ lat: Cesium.Math.toDegrees(rect.south), lng: Cesium.Math.toDegrees(rect.east) });

                /// Reuse the current query's WHERE (referencing in_tile), with in_tile
                /// defined as the visible box — same shape as the report queries.
                let condition = /WHERE(.+)GROUP BY/is.exec(query_elem.value)[1];
                const time_cond = getTimeCondition();
                if (time_cond) condition = `(${condition}) AND ${time_cond}`;

                const sql = `WITH
                    mercator_x >= {left:UInt32} AND mercator_x < {right:UInt32}
                    AND mercator_y >= {top:UInt32} AND mercator_y < {bottom:UInt32} AS in_tile
                    SELECT mercator_x, mercator_y, url_sq AS src
                    FROM flickr_mercator
                    WHERE ${condition} AND has(sizes, 'k')
                    ORDER BY count_faves DESC, count_views DESC
                    LIMIT 60`;

                ++query_sequence_num;
                const query_id = `${uuid}-${query_sequence_num}-flickr_photos`;
                const hosts = getHosts('photos');
                const url = host => `${host}/?user=website&default_format=JSON&query_id=${query_id}&replace_running_query=1` +
                    `&param_left=${Math.min(nw.x, se.x)}&param_right=${Math.max(nw.x, se.x)}` +
                    `&param_top=${Math.min(nw.y, se.y)}&param_bottom=${Math.max(nw.y, se.y)}`;

                progress_update_period = 1;

                let rows;
                try {
                    const response = await fetchAny(hosts.map(host => url(host)), { method: 'POST', body: sql });
                    rows = (await response.json()).data;
                } catch (error) {
                    reportTileError(error);
                    return;
                }

                if (!cesiumPhotosActive) return;   /// Toggled off while loading.
                clearPhotos();
                rows.forEach(row => {
                    const ll = mercatorToLatLng(+row.mercator_x, +row.mercator_y);
                    cesiumPhotoEntities.push(cesiumViewer.entities.add({
                        position: Cesium.Cartesian3.fromDegrees(ll.lng, ll.lat),
                        billboard: {
                            image: row.src,
                            width: 48,
                            height: 48,
                            /// Keep thumbnails visible on top of the globe, not clipped.
                            disableDepthTestDistance: Number.POSITIVE_INFINITY,
                        },
                    }));
                });
                hideError();
            }, 400);
        }

        function initCesium() {
            const container = document.getElementById('cesium');
            container.style.display = 'block';

            cesiumViewer = new Cesium.Viewer(container, {
                baseLayer: false,
                baseLayerPicker: false,
                geocoder: false,
                homeButton: false,
                sceneModePicker: false,
                navigationHelpButton: false,
                animation: false,
                timeline: false,
                fullscreenButton: false,
                infoBox: false,
                selectionIndicator: false,
                terrainProvider: new Cesium.EllipsoidTerrainProvider(),
                /// Render at the display's native pixel ratio; the default (CSS pixels)
                /// looks blurry on HiDPI/retina screens.
                useBrowserRecommendedResolution: false,
            });

            /// Dark, minimal styling to match the rest of the app.
            const scene = cesiumViewer.scene;
            scene.backgroundColor = Cesium.Color.fromCssColorString('#101213');
            scene.globe.baseColor = Cesium.Color.fromCssColorString('#101213');
            scene.skyBox.show = false;
            scene.sun.show = false;
            scene.moon.show = false;
            scene.globe.showGroundAtmosphere = false;
            scene.skyAtmosphere.show = false;   /// No atmospheric glow around the limb.
            scene.fog.enabled = false;

            /// Free the right mouse button for selection: zoom stays on the wheel and
            /// pinch, but not right-drag (a Cesium default).
            scene.screenSpaceCameraController.zoomEventTypes = [
                Cesium.CameraEventType.WHEEL,
                Cesium.CameraEventType.PINCH,
            ];

            /// Faint OSM underlay for geographic context, like the 2D map's base layer.
            cesiumOsmLayer = cesiumViewer.imageryLayers.addImageryProvider(
                new Cesium.UrlTemplateImageryProvider({
                    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                    credit: '© OpenStreetMap',
                    maximumLevel: 19,
                }));
            cesiumOsmLayer.alpha = 0.15;

            /// If a shared link points at a location, fly there; otherwise keep
            /// Cesium's whole-globe view as the landing for a bare ?3d=1. Read from
            /// the URL directly so a saved query (restored asynchronously) doesn't
            /// race the camera setup.
            const params = new URLSearchParams(window.location.search);
            const lat = parseFloat(params.get('lat'));
            const lng = parseFloat(params.get('lng'));
            if (Number.isFinite(lat) && Number.isFinite(lng)) {
                const zoom = parseFloat(params.get('zoom'));
                const height = 4e7 / Math.pow(2, Number.isFinite(zoom) ? zoom : 5);
                cesiumViewer.camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(lng, lat, height),
                });
            }

            /// Pick the uniform level for the initial view and build the density layer,
            /// then re-evaluate it whenever the camera zooms enough to matter.
            cesiumLevel = cesiumTargetLevel(scene);
            cesiumRefresh();
            scene.camera.percentageChanged = 0.2;
            scene.camera.changed.addEventListener(() => {
                cesiumUpdateLevel(scene);
                cesiumUpdatePhotos();
            });
            /// Persist the camera view to the URL when movement ends (like the 2D map's
            /// moveend), so the link reflects and restores the actual 3D view.
            cesiumViewer.camera.moveEnd.addEventListener(updateHistory);

            /// Let the 👁 toggle also brighten the OSM underlay in 3D.
            document.getElementById('layers').addEventListener('click', () => {
                if (cesiumOsmLayer) cesiumOsmLayer.alpha = cesiumOsmLayer.alpha < 0.5 ? 0.6 : 0.15;
            });

            /// Clicking the globe dismisses the query editor, like clicking the 2D map
            /// (whose focus handler never fires because Cesium covers its container).
            scene.canvas.addEventListener('pointerdown', collapseQueryEditor);

            setupCesiumSelection(scene);
        }

        /// Draw `selected_box` on the globe, or nothing when there is no selection.
        ///
        /// setupCesiumSelection's drag handlers set the rectangle themselves, to follow the
        /// pointer while a drag is still in progress. This is for the selections that arrive
        /// without a drag: the `box` URL parameter of a link opened directly in 3D, switching
        /// to 3D with a report already open (which reloads the page with `box` in the link),
        /// history navigation, and closing the report. showReport()/hideReport() call it, so
        /// the globe follows the selection whichever way it was made.
        function cesiumUpdateSelection() {
            /// Cesium loads asynchronously and may not be up yet; setupCesiumSelection calls
            /// this once it is, which is what makes a selection from the link show up.
            if (!cesiumViewer) return;

            if (selected_box.length != 2) {
                cesiumSelectionRectangle = null;
                return;
            }

            /// A selection box is bounded by constant longitude/latitude lines, so the corners
            /// are enough to place it on the sphere.
            cesiumSelectionRectangle = Cesium.Rectangle.fromDegrees(
                Math.min(selected_box[0].lng, selected_box[1].lng),
                Math.min(selected_box[0].lat, selected_box[1].lat),
                Math.max(selected_box[0].lng, selected_box[1].lng),
                Math.max(selected_box[0].lat, selected_box[1].lat));
        }

        /// Right-drag a rectangle on the globe to select a region and open its report,
        /// mirroring the 2D box selection. Corner coordinates come from picking the
        /// globe surface; right-drag is free because we removed it from the camera's
        /// zoom event types. A selection box in Mercator is bounded by constant
        /// longitude/latitude lines — i.e. a geographic rectangle — so it is drawn as a
        /// globe entity that curves correctly on the sphere and tracks the camera.
        function setupCesiumSelection(scene) {
            const handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);
            let startCarto = null;     /// Cartographic where the drag began, or null.
            let startPx = null;        /// Canvas pixel where the drag began.

            /// Suppress the browser context menu so right-drag selection is usable.
            scene.canvas.addEventListener('contextmenu', e => e.preventDefault());

            /// One reusable entity; a CallbackProperty lets it update smoothly during
            /// the drag without rebuilding the geometry.
            cesiumViewer.entities.add({
                rectangle: {
                    coordinates: new Cesium.CallbackProperty(() => cesiumSelectionRectangle, false),
                    material: Cesium.Color.WHITE.withAlpha(0.2),
                    outline: true,
                    outlineColor: Cesium.Color.WHITE,
                    height: 0,
                },
            });

            /// A selection may already be waiting — from the link, or from the reload that
            /// switching to 3D does — and it has nothing to do with a drag.
            cesiumUpdateSelection();

            function pickCarto(px) {
                const cartesian = scene.camera.pickEllipsoid(px, scene.globe.ellipsoid);
                return cartesian ? Cesium.Cartographic.fromCartesian(cartesian) : null;
            }

            function setRectangle(a, b) {
                cesiumSelectionRectangle = new Cesium.Rectangle(
                    Math.min(a.longitude, b.longitude), Math.min(a.latitude, b.latitude),
                    Math.max(a.longitude, b.longitude), Math.max(a.latitude, b.latitude));
            }

            function toLatLng(carto) {
                return { lat: Cesium.Math.toDegrees(carto.latitude), lng: Cesium.Math.toDegrees(carto.longitude) };
            }

            handler.setInputAction(e => {
                const c = pickCarto(e.position);
                if (!c) return;              /// Ignore drags that start off the globe.
                startCarto = c;
                startPx = e.position.clone();
                setRectangle(c, c);
            }, Cesium.ScreenSpaceEventType.RIGHT_DOWN);

            handler.setInputAction(e => {
                if (!startCarto) return;
                const c = pickCarto(e.endPosition);
                if (c) setRectangle(startCarto, c);
            }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

            handler.setInputAction(e => {
                if (!startCarto) return;
                const a = startCarto;
                const downPx = startPx;
                startCarto = null;

                /// A right-click (no meaningful drag) closes the report instead of
                /// selecting a degenerate region. hideSelection() clears `selected_box`,
                /// and the rectangle follows it off the globe.
                if (Cesium.Cartesian2.distance(downPx, e.position) < 5) {
                    hideSelection();
                    return;
                }

                const b = pickCarto(e.position);
                if (!b) return;
                setRectangle(a, b);
                selected_box = [latlngToMercator(toLatLng(a)), latlngToMercator(toLatLng(b))];
                showReport();
            }, Cesium.ScreenSpaceEventType.RIGHT_UP);
        }

        async function enable3D() {
            window.CESIUM_BASE_URL = CESIUM_BASE;

            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = CESIUM_BASE + 'Widgets/widgets.css';
            document.head.appendChild(css);

            try {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = CESIUM_BASE + 'Cesium.js';
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('Failed to load CesiumJS from ' + script.src));
                    document.head.appendChild(script);
                });
                initCesium();
            } catch (error) {
                showError(error.toString());
            }
        }

        if (is3D) {
            enable3D();
        }
    </script>
</body>
</html>
